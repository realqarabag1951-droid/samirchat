<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SamirChat</title>

<style>

:root{
  --bg:#f6f4ff;
  --card:rgba(255,255,255,.82);
  --text:#25233a;
  --muted:#817e99;
  --primary:#7c6cf2;
  --primary2:#a78bfa;
  --soft:#eeeaff;
  --online:#43d17a;
  --danger:#e05270;
  --shadow:0 18px 55px rgba(76,62,145,.13);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 10%,
      #e9e4ff 0,
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 90%,
      #ffe8f4 0,
      transparent 30%
    ),
    var(--bg);

  min-height:100vh;
}


/* LOGIN */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginCard{
  width:min(430px,100%);
  background:var(--card);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.8);
  border-radius:28px;

  padding:35px;

  box-shadow:var(--shadow);

  text-align:center;
}

.loginLogo{
  width:65px;
  height:65px;

  border-radius:20px;

  display:grid;
  place-items:center;

  margin:0 auto 18px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:white;

  font-size:30px;
  font-weight:900;
}

.loginCard h1{
  margin:0 0 8px;
}

.loginCard p{
  color:var(--muted);
  margin-bottom:25px;
}

.usernameInput{
  width:100%;

  padding:16px;

  border:0;
  outline:0;

  background:#f1effa;

  border-radius:16px;

  font-size:16px;

  margin-bottom:12px;
}

.loginButton{
  width:100%;

  border:0;

  padding:16px;

  border-radius:16px;

  background:var(--primary);

  color:white;

  font-size:16px;

  font-weight:800;

  cursor:pointer;
}

.loginButton:disabled{
  opacity:.6;
}

.error{
  color:var(--danger);

  font-size:14px;

  min-height:20px;

  margin-bottom:8px;
}


/* APP */

.app{
  max-width:1180px;
  margin:auto;
  padding:24px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:16px 20px;

  margin-bottom:20px;

  background:var(--card);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.8);

  border-radius:24px;

  box-shadow:var(--shadow);
}

.logo{
  display:flex;
  align-items:center;

  gap:12px;

  font-weight:800;
  font-size:23px;
}

.logoMark{
  width:43px;
  height:43px;

  border-radius:15px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:white;
}

.tiktok{
  color:#fff;

  text-decoration:none;

  background:#191827;

  padding:11px 16px;

  border-radius:14px;

  font-weight:700;
}


/* LAYOUT */

.layout{
  display:grid;

  grid-template-columns:330px 1fr;

  gap:20px;
}

.panel,
.chat{
  background:var(--card);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.8);

  box-shadow:var(--shadow);

  border-radius:26px;
}

.panel{
  padding:20px;
}

.search{
  width:100%;

  padding:14px 16px;

  border:0;
  outline:0;

  background:#f1effa;

  border-radius:15px;

  font-size:15px;
}

.title{
  margin:20px 0 12px;

  font-weight:800;
}


/* USERS */

.user{
  display:flex;

  align-items:center;

  gap:12px;

  padding:13px;

  border-radius:17px;

  cursor:pointer;
}

.user:hover{
  background:var(--soft);
}

.avatar{
  width:45px;
  height:45px;

  min-width:45px;

  border-radius:15px;

  display:grid;

  place-items:center;

  color:white;

  font-weight:800;

  background:
    linear-gradient(
      135deg,
      #8b7cf6,
      #c59cff
    );
}

.userInfo{
  min-width:0;
  flex:1;
}

.userInfo b{
  display:block;

  overflow:hidden;

  text-overflow:ellipsis;
}

.userInfo small{
  color:var(--muted);
}

.dmButton{
  border:0;

  background:var(--soft);

  color:var(--primary);

  padding:8px 10px;

  border-radius:10px;

  font-weight:800;

  cursor:pointer;
}


/* CHAT */

.chat{
  min-height:650px;

  display:flex;

  flex-direction:column;

  overflow:hidden;
}

.chatHead{
  padding:20px 24px;

  border-bottom:1px solid #eeeaf8;

  display:flex;

  align-items:center;

  gap:13px;
}

.chatHeadInfo{
  flex:1;
}

.chatHeadTitle{
  font-weight:800;
}

.chatHeadStatus{
  color:var(--muted);

  font-size:13px;
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--online);

  display:inline-block;

  margin-left:4px;
}

.backButton{
  display:none;

  border:0;

  background:var(--soft);

  color:var(--primary);

  border-radius:12px;

  padding:9px 12px;

  font-weight:800;
}


/* DM WARNING */

.dmWarning{
  display:none;

  padding:11px 18px;

  background:#fff8e7;

  color:#765d20;

  font-size:13px;

  text-align:center;

  border-bottom:1px solid #f2e5bc;
}


/* MESSAGES */

.messages{
  flex:1;

  padding:28px;

  display:flex;

  flex-direction:column;

  gap:13px;

  overflow-y:auto;
}

.msg{
  max-width:65%;

  padding:13px 16px;

  border-radius:19px;

  line-height:1.4;

  word-break:break-word;
}

.them{
  background:#eeeaf9;

  align-self:flex-start;

  border-bottom-left-radius:6px;
}

.me{
  background:
    linear-gradient(
      135deg,
      var(--primary),
      #9b82f7
    );

  color:white;

  align-self:flex-end;

  border-bottom-right-radius:6px;
}

.msgName{
  font-size:12px;

  font-weight:800;

  margin-bottom:4px;

  opacity:.7;
}

.time{
  font-size:11px;

  opacity:.62;

  margin-top:4px;
}

.system{
  align-self:center;

  color:var(--muted);

  font-size:12px;

  text-align:center;
}


/* WELCOME */

.empty{
  margin:auto;

  text-align:center;

  color:var(--muted);
}

.emptyIcon{
  font-size:55px;

  margin-bottom:10px;
}


/* COMPOSER */

.composer{
  display:flex;

  gap:10px;

  padding:17px;

  border-top:1px solid #eeeaf8;
}

.composer input{
  flex:1;

  border:0;
  outline:0;

  background:#f1effa;

  border-radius:16px;

  padding:14px;

  font-size:15px;
}

.send{
  border:0;

  color:white;

  background:var(--primary);

  padding:0 20px;

  border-radius:16px;

  font-weight:800;

  cursor:pointer;
}

.send:disabled{
  opacity:.5;
}


/* MOBILE */

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .panel{
    display:block;
  }

  .chat{
    display:none;

    min-height:75vh;
  }

  .app{
    padding:12px;
  }

  .msg{
    max-width:82%;
  }

  .tiktok{
    padding:9px 11px;
    font-size:13px;
  }

  body.dmOpen .panel{
    display:none;
  }

  body.dmOpen .chat{
    display:flex;
  }

  body.dmOpen .backButton{
    display:block;
  }

}


/* DESKTOP DM */

body.dmOpen .chat{
  display:flex;
}

body.dmOpen .panel{
  display:block;
}

</style>
</head>

<body>


<!-- LOGIN -->

<section
  class="login"
  id="loginScreen"
>

  <div class="loginCard">

    <div class="loginLogo">
      S
    </div>

    <h1>
      SamirChat
    </h1>

    <p>
      Username seç və dostlarınla
      real vaxtda söhbət et.
    </p>

    <input
      id="usernameInput"
      class="usernameInput"
      maxlength="20"
      autocomplete="off"
      placeholder="Username daxil et..."
    >

    <div
      id="loginError"
      class="error"
    ></div>

    <button
      id="loginButton"
      class="loginButton"
    >
      Çata daxil ol
    </button>

  </div>

</section>


<!-- APP -->

<div
  class="app"
  id="chatApp"
  style="display:none"
>

<header>

  <div class="logo">

    <div class="logoMark">
      S
    </div>

    SamirChat

  </div>

  <a
    class="tiktok"
    href="https://www.tiktok.com/@ssamirreds"
    target="_blank"
    rel="noopener"
  >
    TikTok · @ssamirreds
  </a>

</header>


<div class="layout">


<!-- USERS -->

<aside class="panel">

  <input
    id="searchInput"
    class="search"
    placeholder="🔎 Username axtar..."
    autocomplete="off"
  >

  <div class="title">
    Online istifadəçilər
  </div>

  <div id="usersList"></div>

</aside>


<!-- CHAT -->

<main class="chat">

  <div class="chatHead">

    <button
      class="backButton"
      id="backButton"
    >
      ← Geri
    </button>

    <div
      class="avatar"
      id="chatAvatar"
    >
      S
    </div>

    <div class="chatHeadInfo">

      <div
        class="chatHeadTitle"
        id="chatTitle"
      >
        SamirChat
      </div>

      <div
        class="chatHeadStatus"
        id="connectionText"
      >
        qoşulur...
      </div>

    </div>

  </div>


  <!-- DM WARNING -->

  <div
    class="dmWarning"
    id="dmWarning"
  >
    💜 Bir-birinizə qarşı hörmətli olun.
    Nalayiq sözlərdən istifadə etməyin.
  </div>


  <!-- MESSAGES -->

  <div
    class="messages"
    id="messages"
  >

    <div
      class="empty"
      id="emptyMessage"
    >

      <div class="emptyIcon">
        💬
      </div>

      <h2>
        SamirChat-a xoş gəlmisən
      </h2>

      <p>
        Username ilə dostlarını tap
        və rahat söhbət et.
      </p>

    </div>

  </div>


  <!-- COMPOSER -->

  <div class="composer">

    <input
      id="messageInput"
      maxlength="500"
      autocomplete="off"
      placeholder="Mesaj yaz..."
    >

    <button
      class="send"
      id="sendButton"
    >
      Göndər
    </button>

  </div>

</main>

</div>

</div>


<script>

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const chatApp =
  document.getElementById(
    "chatApp"
  );

const usernameInput =
  document.getElementById(
    "usernameInput"
  );

const loginButton =
  document.getElementById(
    "loginButton"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const messageInput =
  document.getElementById(
    "messageInput"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const messages =
  document.getElementById(
    "messages"
  );

const usersList =
  document.getElementById(
    "usersList"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const connectionText =
  document.getElementById(
    "connectionText"
  );

const chatAvatar =
  document.getElementById(
    "chatAvatar"
  );

const chatTitle =
  document.getElementById(
    "chatTitle"
  );

const dmWarning =
  document.getElementById(
    "dmWarning"
  );

const backButton =
  document.getElementById(
    "backButton"
  );


let username = "";

let socket = null;

let selectedUser = null;

let currentMode = "general";


/*
 * LOGIN
 */

loginButton.addEventListener(
  "click",
  login
);


usernameInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      login();
    }

  }
);


async function login(){

  const value =
    usernameInput.value.trim();

  loginError.textContent = "";

  if(
    !/^[A-Za-z0-9_]{3,20}$/.test(value)
  ){

    loginError.textContent =
      "Username 3-20 simvol olmalıdır. Yalnız hərf, rəqəm və _ istifadə et.";

    return;
  }

  loginButton.disabled = true;

  loginButton.textContent =
    "Yoxlanılır...";


  try{

    const response =
      await fetch(
        "/api/register",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            username:value
          })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      loginError.textContent =
        data.error ||
        "Username istifadə edilə bilmir.";

      return;
    }


    username =
      data.username;


    chatAvatar.textContent =
      username
        .charAt(0)
        .toUpperCase();


    loginScreen.style.display =
      "none";

    chatApp.style.display =
      "block";


    connect();

  }
  catch(error){

    loginError.textContent =
      "Serverə qoşulmaq mümkün olmadı.";

  }
  finally{

    loginButton.disabled =
      false;

    loginButton.textContent =
      "Çata daxil ol";

  }

}


/*
 * WEBSOCKET
 */

function connect(){

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host +
      "/ws?username=" +
      encodeURIComponent(username)
    );


  socket.addEventListener(
    "open",
    function(){

      connectionText.textContent =
        "online";

      showGeneral();

    }
  );


  socket.addEventListener(
    "message",
    function(event){

      try{

        const data =
          JSON.parse(event.data);


        /*
         * ONLINE USERS
         */

        if(
          data.type === "welcome" ||
          data.type === "users"
        ){

          updateUsers(
            data.users || []
          );

          return;
        }


        /*
         * GENERAL MESSAGE
         */

        if(data.type === "message"){

          if(
            currentMode === "general"
          ){

            addMessage(
              data.username,
              data.text,
              data.time
            );

          }

          return;
        }


        /*
         * DM
         */

        if(data.type === "dm"){

          /*
           * Yalnız hazırda açıq olan
           * söhbətə göstər
           */

          if(
            currentMode === "dm" &&
            selectedUser &&
            (
              data.from.toLowerCase() ===
              selectedUser.toLowerCase()
              ||
              data.to.toLowerCase() ===
              selectedUser.toLowerCase()
            )
          ){

            addDMMessage(
              data.from,
              data.to,
              data.text,
              data.time
            );

          }

          return;
        }


        /*
         * DM HISTORY
         */

        if(
          data.type === "dm_history"
        ){

          /*
           * Əvvəlki mesajları göstər
           */

          if(
            currentMode === "dm" &&
            selectedUser &&
            data.with.toLowerCase() ===
            selectedUser.toLowerCase()
          ){

            clearMessages();

            const history =
              data.messages || [];


            if(history.length === 0){

              showEmptyDM();

            }
            else{

              history.forEach(
                function(msg){

                  addDMMessage(
                    msg.from,
                    msg.to,
                    msg.text,
                    msg.time
                  );

                }
              );

            }

          }

          return;
        }


        /*
         * SYSTEM
         */

        if(data.type === "system"){

          if(
            currentMode === "general"
          ){

            addSystem(
              data.text
            );

          }

        }

      }
      catch(error){

        console.log(
          "Message error:",
          error
        );

      }

    }
  );


  socket.addEventListener(
    "close",
    function(){

      connectionText.textContent =
        "offline";

      addSystem(
        "Serverlə əlaqə kəsildi."
      );

    }
  );

}


/*
 * GENERAL CHAT
 */

function showGeneral(){

  currentMode =
    "general";

  selectedUser =
    null;

  document.body.classList.remove(
    "dmOpen"
  );

  chatTitle.textContent =
    "SamirChat";

  chatAvatar.textContent =
    "S";

  dmWarning.style.display =
    "none";

  clearMessages();

  showEmptyGeneral();

  messageInput.placeholder =
    "Ümumi söhbətə mesaj yaz...";

}


/*
 * OPEN DM
 */

function openDM(user){

  if(
    user.toLowerCase() ===
    username.toLowerCase()
  ){

    return;
  }


  currentMode =
    "dm";

  selectedUser =
    user;


  document.body.classList.add(
    "dmOpen"
  );


  chatTitle.textContent =
    "@" + user;


  chatAvatar.textContent =
    user
      .charAt(0)
      .toUpperCase();


  dmWarning.style.display =
    "block";


  clearMessages();


  messageInput.placeholder =
    "@" +
    user +
    " üçün mesaj yaz...";


  /*
   * Serverdən DM tarixçəsini istə
   */

  if(
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify({
        type:"dm_history",
        with:user
      })
    );

  }

  messageInput.focus();

}


/*
 * BACK
 */

backButton.addEventListener(
  "click",
  function(){

    showGeneral();

  }
);


/*
 * SEND MESSAGE
 */

sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      sendMessage();
    }

  }
);


function sendMessage(){

  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  if(
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ){

    addSystem(
      "Serverə qoşulu deyilsən."
    );

    return;
  }


  /*
   * DM
   */

  if(
    currentMode === "dm" &&
    selectedUser
  ){

    socket.send(
      JSON.stringify({
        type:"dm",
        to:selectedUser,
        text:text
      })
    );

  }


  /*
   * GENERAL CHAT
   */

  else{

    socket.send(
      JSON.stringify({
        type:"message",
        text:text
      })
    );

  }


  messageInput.value = "";

  messageInput.focus();

}


/*
 * ADD GENERAL MESSAGE
 */

function addMessage(
  sender,
  text,
  timestamp
){

  removeEmpty();


  const box =
    document.createElement(
      "div"
    );


  box.className =
    sender === username
      ? "msg me"
      : "msg them";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "msgName";


  name.textContent =
    sender === username
      ? "Sən"
      : "@" + sender;


  const content =
    document.createElement(
      "div"
    );


  content.textContent =
    text;


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "time";

  time.textContent =
    formatTime(timestamp);


  box.appendChild(name);

  box.appendChild(content);

  box.appendChild(time);


  messages.appendChild(box);

  scrollBottom();

}


/*
 * ADD DM MESSAGE
 */

function addDMMessage(
  from,
  to,
  text,
  timestamp
){

  removeEmpty();


  const box =
    document.createElement(
      "div"
    );


  box.className =
    from === username
      ? "msg me"
      : "msg them";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "msgName";


  name.textContent =
    from === username
      ? "Sən"
      : "@" + from;


  const content =
    document.createElement(
      "div"
    );


  content.textContent =
    text;


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "time";

  time.textContent =
    formatTime(timestamp);


  box.appendChild(name);

  box.appendChild(content);

  box.appendChild(time);


  messages.appendChild(box);

  scrollBottom();

}


/*
 * USERS
 */

function updateUsers(users){

  usersList.innerHTML = "";


  const filtered =
    users.filter(
      function(user){

        return (
          user.toLowerCase() !==
          username.toLowerCase()
        );

      }
    );


  if(filtered.length === 0){

    usersList.innerHTML =
      '<div style="color:var(--muted);padding:12px">Hazırda başqa online istifadəçi yoxdur.</div>';

    return;
  }


  filtered.forEach(
    function(user){

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "user";


      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";

      avatar.textContent =
        user
          .charAt(0)
          .toUpperCase();


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "userInfo";


      const name =
        document.createElement(
          "b"
        );

      name.textContent =
        "@" + user;


      const status =
        document.createElement(
          "small"
        );

      status.textContent =
        "online
