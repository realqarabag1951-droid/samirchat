<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SamirChat</title>

<style>
:root{
  --bg:#f6f4ff;
  --card:rgba(255,255,255,.82);
  --text:#25233a;
  --muted:#817e99;
  --primary:#7c6cf2;
  --primary2:#a78bfa;
  --soft:#eeeaff;
  --online:#43d17a;
  --danger:#e05270;
  --shadow:0 18px 55px rgba(76,62,145,.13);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,#e9e4ff 0,transparent 32%),
    radial-gradient(circle at 90% 90%,#ffe8f4 0,transparent 30%),
    var(--bg);
  min-height:100vh;
}

/* LOGIN */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginCard{
  width:min(430px,100%);
  background:var(--card);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:28px;
  padding:35px;
  box-shadow:var(--shadow);
  text-align:center;
}

.loginLogo{
  width:65px;
  height:65px;
  border-radius:20px;
  display:grid;
  place-items:center;
  margin:0 auto 18px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  font-size:30px;
  font-weight:900;
}

.loginCard h1{
  margin:0 0 8px;
}

.loginCard p{
  color:var(--muted);
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:16px;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:16px;
  font-size:16px;
  margin-bottom:12px;
}

.button{
  width:100%;
  border:0;
  padding:16px;
  border-radius:16px;
  background:var(--primary);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.button:disabled{
  opacity:.6;
}

.error{
  color:var(--danger);
  font-size:14px;
  min-height:20px;
  margin-bottom:10px;
}

.loginSwitch{
  margin-top:16px;
  color:var(--muted);
  font-size:14px;
}

.loginSwitch button{
  border:0;
  background:none;
  color:var(--primary);
  font-weight:800;
  cursor:pointer;
}

/* APP */

.app{
  max-width:1180px;
  margin:auto;
  padding:24px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  margin-bottom:20px;
  background:var(--card);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:23px;
}

.logoMark{
  width:43px;
  height:43px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
}

.tiktok{
  color:#fff;
  text-decoration:none;
  background:#191827;
  padding:11px 16px;
  border-radius:14px;
  font-weight:700;
}

.layout{
  display:grid;
  grid-template-columns:330px 1fr;
  gap:20px;
}

.panel,
.chat{
  background:var(--card);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:var(--shadow);
  border-radius:26px;
}

.panel{
  padding:20px;
}

.search{
  width:100%;
  padding:14px 16px;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:15px;
  font-size:15px;
}

.title{
  margin:20px 0 12px;
  font-weight:800;
}

/* USER */

.user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-radius:17px;
  cursor:pointer;
  transition:.15s;
}

.user:hover{
  background:var(--soft);
}

.user.active{
  background:var(--soft);
}

.avatar{
  width:45px;
  height:45px;
  min-width:45px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#8b7cf6,#c59cff);
}

.user b{
  display:block;
}

.user small{
  color:var(--muted);
}

/* CHAT */

.chat{
  min-height:650px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.chatHead{
  padding:20px 24px;
  border-bottom:1px solid #eeeaf8;
  display:flex;
  align-items:center;
  gap:13px;
}

.chatTitle{
  font-weight:800;
}

.chatSubtitle{
  color:var(--muted);
  font-size:13px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--online);
  display:inline-block;
  margin-left:4px;
}

.backButton{
  display:none;
  border:0;
  background:#eeeaf9;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:20px;
  cursor:pointer;
}

/* MESSAGES */

.messages{
  flex:1;
  padding:28px;
  display:flex;
  flex-direction:column;
  gap:13px;
  overflow-y:auto;
}

.msg{
  max-width:65%;
  padding:13px 16px;
  border-radius:19px;
  line-height:1.4;
  word-break:break-word;
}

.them{
  background:#eeeaf9;
  align-self:flex-start;
  border-bottom-left-radius:6px;
}

.me{
  background:linear-gradient(135deg,var(--primary),#9b82f7);
  color:white;
  align-self:flex-end;
  border-bottom-right-radius:6px;
}

.msgName{
  font-size:12px;
  font-weight:800;
  margin-bottom:4px;
  opacity:.7;
}

.time{
  font-size:11px;
  opacity:.62;
  margin-top:4px;
}

.system{
  align-self:center;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

.empty{
  margin:auto;
  text-align:center;
  color:var(--muted);
}

.emptyIcon{
  font-size:55px;
}

/* COMPOSER */

.composer{
  display:flex;
  gap:10px;
  padding:17px;
  border-top:1px solid #eeeaf8;
}

.composer input{
  flex:1;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:16px;
  padding:14px;
  font-size:15px;
}

.send{
  border:0;
  color:white;
  background:var(--primary);
  padding:0 20px;
  border-radius:16px;
  font-weight:800;
  cursor:pointer;
}

.send:disabled{
  opacity:.5;
}

/* MOBILE */

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .panel{
    display:block;
  }

  .chat{
    display:none;
    min-height:75vh;
  }

  .app{
    padding:12px;
  }

  .msg{
    max-width:82%;
  }

  .tiktok{
    padding:9px 11px;
    font-size:13px;
  }

  .mobile-chat .panel{
    display:none;
  }

  .mobile-chat .chat{
    display:flex;
  }

  .mobile-chat .backButton{
    display:block;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section class="login" id="loginScreen">

  <div class="loginCard">

    <div class="loginLogo">S</div>

    <h1>SamirChat</h1>

    <p id="loginDescription">
      Username və kod ilə SamirChat-a daxil ol.
    </p>

    <input
      id="usernameInput"
      class="input"
      maxlength="20"
      autocomplete="username"
      placeholder="Username"
    >

    <input
      id="codeInput"
      class="input"
      maxlength="6"
      inputmode="numeric"
      autocomplete="current-password"
      placeholder="4-6 rəqəmli kod"
    >

    <div id="loginError" class="error"></div>

    <button id="loginButton" class="button">
      Daxil ol
    </button>

    <div class="loginSwitch">
      <span id="switchText">
        Hesabın yoxdur?
      </span>

      <button id="switchButton">
        Hesab yarat
      </button>
    </div>

  </div>

</section>


<!-- APP -->

<div class="app" id="chatApp" style="display:none">

<header>

  <div class="logo">
    <div class="logoMark">S</div>
    SamirChat
  </div>

  <div style="display:flex;gap:8px;align-items:center">

    <span
      id="myUsername"
      style="font-weight:700"
    ></span>

    <a
      class="tiktok"
      href="https://www.tiktok.com/@ssamirreds"
      target="_blank"
      rel="noopener"
    >
      TikTok · @ssamirreds
    </a>

  </div>

</header>


<div class="layout">

<!-- ONLINE USERS -->

<aside class="panel">

  <input
    id="searchInput"
    class="search"
    placeholder="🔎 Username axtar..."
    autocomplete="off"
  >

  <div class="title">
    Online istifadəçilər
  </div>

  <div id="usersList"></div>

</aside>


<!-- CHAT -->

<main class="chat">

  <div class="chatHead">

    <button
      class="backButton"
      id="backButton"
    >
      ←
    </button>

    <div
      class="avatar"
      id="chatAvatar"
    >
      S
    </div>

    <div>

      <div
        class="chatTitle"
        id="chatTitle"
      >
        SamirChat
      </div>

      <div
        class="chatSubtitle"
        id="chatSubtitle"
      >
        Online istifadəçi seç
      </div>

    </div>

  </div>


  <div
    class="messages"
    id="messages"
  >

    <div
      class="empty"
      id="emptyMessage"
    >

      <div class="emptyIcon">
        💬
      </div>

      <h2>SamirChat-a xoş gəlmisən</h2>

      <p>
        Soldan online istifadəçi seç və şəxsi söhbətə başla.
      </p>

    </div>

  </div>


  <div class="composer">

    <input
      id="messageInput"
      maxlength="500"
      autocomplete="off"
      placeholder="Əvvəlcə istifadəçi seç..."
      disabled
    >

    <button
      class="send"
      id="sendButton"
      disabled
    >
      Göndər
    </button>

  </div>

</main>

</div>

</div>


<script>

/* =========================
   STATE
========================= */

let username = "";
let socket = null;
let isRegisterMode = false;
let selectedUser = null;


/* =========================
   ELEMENTS
========================= */

const loginScreen =
  document.getElementById("loginScreen");

const chatApp =
  document.getElementById("chatApp");

const usernameInput =
  document.getElementById("usernameInput");

const codeInput =
  document.getElementById("codeInput");

const loginButton =
  document.getElementById("loginButton");

const loginError =
  document.getElementById("loginError");

const loginDescription =
  document.getElementById("loginDescription");

const switchText =
  document.getElementById("switchText");

const switchButton =
  document.getElementById("switchButton");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const messages =
  document.getElementById("messages");

const usersList =
  document.getElementById("usersList");

const searchInput =
  document.getElementById("searchInput");

const chatAvatar =
  document.getElementById("chatAvatar");

const chatTitle =
  document.getElementById("chatTitle");

const chatSubtitle =
  document.getElementById("chatSubtitle");

const myUsername =
  document.getElementById("myUsername");

const backButton =
  document.getElementById("backButton");


/* =========================
   LOGIN SWITCH
========================= */

switchButton.addEventListener(
  "click",
  function(){

    isRegisterMode =
      !isRegisterMode;

    loginError.textContent = "";

    if(isRegisterMode){

      loginDescription.textContent =
        "Öz username və 4-6 rəqəmli kodunu yarat.";

      loginButton.textContent =
        "Hesab yarat";

      switchText.textContent =
        "Artıq hesabın var?";

      switchButton.textContent =
        "Daxil ol";

    }else{

      loginDescription.textContent =
        "Username və kod ilə SamirChat-a daxil ol.";

      loginButton.textContent =
        "Daxil ol";

      switchText.textContent =
        "Hesabın yoxdur?";

      switchButton.textContent =
        "Hesab yarat";
    }

  }
);


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
  "click",
  submitLogin
);

usernameInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      submitLogin();
    }

  }
);

codeInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      submitLogin();
    }

  }
);


async function submitLogin(){

  const value =
    usernameInput.value.trim();

  const code =
    codeInput.value.trim();

  loginError.textContent = "";

  if(
    !/^[A-Za-z0-9_]{3,20}$/.test(value)
  ){

    loginError.textContent =
      "Username 3-20 simvol olmalıdır.";

    return;
  }

  if(
    !/^\d{4,6}$/.test(code)
  ){

    loginError.textContent =
      "Kod 4-6 rəqəmdən ibarət olmalıdır.";

    return;
  }

  loginButton.disabled = true;

  loginButton.textContent =
    isRegisterMode
      ? "Hesab yaradılır..."
      : "Daxil olunur...";

  try{

    const endpoint =
      isRegisterMode
        ? "/api/register"
        : "/api/login";
