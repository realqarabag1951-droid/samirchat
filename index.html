<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SamirChat</title>

<style>
:root{
  --bg:#f6f4ff;
  --card:rgba(255,255,255,.82);
  --text:#25233a;
  --muted:#817e99;
  --primary:#7c6cf2;
  --primary2:#a78bfa;
  --soft:#eeeaff;
  --online:#43d17a;
  --danger:#e05270;
  --shadow:0 18px 55px rgba(76,62,145,.13);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,#e9e4ff 0,transparent 32%),
    radial-gradient(circle at 90% 90%,#ffe8f4 0,transparent 30%),
    var(--bg);
  min-height:100vh;
}

/* LOGIN */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginCard{
  width:min(430px,100%);
  background:var(--card);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:28px;
  padding:35px;
  box-shadow:var(--shadow);
  text-align:center;
}

.loginLogo{
  width:65px;
  height:65px;
  border-radius:20px;
  display:grid;
  place-items:center;
  margin:0 auto 18px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  font-size:30px;
  font-weight:900;
}

.loginCard h1{
  margin:0 0 8px;
}

.loginCard p{
  color:var(--muted);
}

.modeButtons{
  display:flex;
  gap:8px;
  margin:22px 0 15px;
}

.modeButton{
  flex:1;
  border:0;
  padding:12px;
  border-radius:14px;
  cursor:pointer;
  background:#eeeaf9;
  color:var(--text);
  font-weight:700;
}

.modeButton.active{
  background:var(--primary);
  color:white;
}

.input{
  width:100%;
  padding:15px;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:16px;
  font-size:16px;
  margin-bottom:10px;
}

.loginButton{
  width:100%;
  border:0;
  padding:16px;
  border-radius:16px;
  background:var(--primary);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.loginButton:disabled{
  opacity:.6;
}

.error{
  color:var(--danger);
  font-size:14px;
  min-height:20px;
  margin:5px 0;
}

/* APP */

.app{
  max-width:1180px;
  margin:auto;
  padding:24px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  margin-bottom:20px;
  background:var(--card);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:23px;
}

.logoMark{
  width:43px;
  height:43px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
}

.account{
  display:flex;
  align-items:center;
  gap:10px;
}

.logout{
  border:0;
  padding:10px 13px;
  border-radius:12px;
  background:#eeeaf9;
  cursor:pointer;
}

.tiktok{
  color:#fff;
  text-decoration:none;
  background:#191827;
  padding:11px 16px;
  border-radius:14px;
  font-weight:700;
}

.layout{
  display:grid;
  grid-template-columns:330px 1fr;
  gap:20px;
}

.panel,.chat{
  background:var(--card);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:var(--shadow);
  border-radius:26px;
}

.panel{
  padding:20px;
}

.search{
  width:100%;
  padding:14px 16px;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:15px;
  font-size:15px;
}

.title{
  margin:20px 0 12px;
  font-weight:800;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-radius:17px;
  cursor:pointer;
}

.user:hover{
  background:var(--soft);
}

.avatar{
  width:45px;
  height:45px;
  min-width:45px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#8b7cf6,#c59cff);
}

.user b{
  display:block;
}

.user small{
  color:var(--muted);
}

.chat{
  min-height:650px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.chatHead{
  padding:20px 24px;
  border-bottom:1px solid #eeeaf8;
  display:flex;
  align-items:center;
  gap:13px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--online);
  display:inline-block;
  margin-left:4px;
}

.messages{
  flex:1;
  padding:28px;
  display:flex;
  flex-direction:column;
  gap:13px;
  overflow-y:auto;
}

.msg{
  max-width:65%;
  padding:13px 16px;
  border-radius:19px;
  line-height:1.4;
  word-break:break-word;
}

.them{
  background:#eeeaf9;
  align-self:flex-start;
  border-bottom-left-radius:6px;
}

.me{
  background:linear-gradient(135deg,var(--primary),#9b82f7);
  color:white;
  align-self:flex-end;
  border-bottom-right-radius:6px;
}

.msgName{
  font-size:12px;
  font-weight:800;
  margin-bottom:4px;
  opacity:.7;
}

.time{
  font-size:11px;
  opacity:.62;
  margin-top:4px;
}

.system{
  align-self:center;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

.notice{
  text-align:center;
  background:#fff7df;
  border:1px solid #f4df9b;
  color:#705d22;
  padding:12px;
  border-radius:15px;
  font-size:13px;
  margin-bottom:5px;
}

.composer{
  display:flex;
  gap:10px;
  padding:17px;
  border-top:1px solid #eeeaf8;
}

.composer input{
  flex:1;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:16px;
  padding:14px;
  font-size:15px;
}

.send{
  border:0;
  color:white;
  background:var(--primary);
  padding:0 20px;
  border-radius:16px;
  font-weight:800;
  cursor:pointer;
}

.empty{
  margin:auto;
  text-align:center;
  color:var(--muted);
}

.emptyIcon{
  font-size:55px;
}

.hidden{
  display:none!important;
}

@media(max-width:800px){
  .layout{
    grid-template-columns:1fr;
  }

  .panel{
    display:none;
  }

  .chat{
    min-height:75vh;
  }

  .app{
    padding:12px;
  }

  .msg{
    max-width:82%;
  }

  .tiktok{
    display:none;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section class="login" id="loginScreen">

<div class="loginCard">

<div class="loginLogo">S</div>

<h1>SamirChat</h1>

<p>Username və kodunla SamirChat-a daxil ol.</p>

<div class="modeButtons">

<button class="modeButton active" id="registerMode">
Hesab yarat
</button>

<button class="modeButton" id="loginMode">
Giriş
</button>

</div>

<input
 id="usernameInput"
 class="input"
 maxlength="20"
 autocomplete="username"
 placeholder="Username"
/>

<input
 id="codeInput"
 class="input"
 maxlength="10"
 minlength="4"
 autocomplete="current-password"
 placeholder="4-10 simvolluq kod"
/>

<div id="loginError" class="error"></div>

<button id="loginButton" class="loginButton">
Hesab yarat
</button>

</div>
</section>


<!-- APP -->

<div class="app hidden" id="chatApp">

<header>

<div class="logo">
<div class="logoMark">S</div>
SamirChat
</div>

<div class="account">

<b id="myUsername"></b>

<button class="logout" id="logoutButton">
Çıxış
</button>

<a
class="tiktok"
href="https://www.tiktok.com/@ssamirreds"
target="_blank"
rel="noopener"
>
TikTok
</a>

</div>

</header>


<div class="layout">

<aside class="panel">

<input
id="searchInput"
class="search"
placeholder="🔎 Username axtar..."
autocomplete="off"
/>

<div class="title">
Online istifadəçilər
</div>

<div id="usersList"></div>

</aside>


<main class="chat">

<div class="chatHead">

<div class="avatar" id="chatAvatar">S</div>

<div>

<b id="chatTitle">
Ümumi söhbət
</b>

<div style="color:var(--muted);font-size:13px">

<span id="connectionText">
qoşulur...
</span>

<span class="dot"></span>

</div>

</div>

</div>


<div class="messages" id="messages">

<div class="notice" id="respectNotice">
💜 Söhbətdə bir-birinizə qarşı hörməti qoruyun.
Nalayiq sözlərdən istifadə etməyin.
</div>

<div class="empty" id="emptyMessage">

<div class="emptyIcon">💬</div>

<h2>SamirChat-a xoş gəlmisən</h2>

<p>Online istifadəçini seçərək DM başlada bilərsən.</p>

</div>

</div>


<div class="composer">

<input
id="messageInput"
maxlength="500"
autocomplete="off"
placeholder="Mesaj yaz..."
/>

<button class="send" id="sendButton">
Göndər
</button>

</div>

</main>

</div>
</div>


<script>

const loginScreen =
document.getElementById("loginScreen");

const chatApp =
document.getElementById("chatApp");

const usernameInput =
document.getElementById("usernameInput");

const codeInput =
document.getElementById("codeInput");

const loginButton =
document.getElementById("loginButton");

const loginError =
document.getElementById("loginError");

const registerMode =
document.getElementById("registerMode");

const loginMode =
document.getElementById("loginMode");

const messageInput =
document.getElementById("messageInput");

const sendButton =
document.getElementById("sendButton");

const messages =
document.getElementById("messages");

const usersList =
document.getElementById("usersList");

const searchInput =
document.getElementById("searchInput");

const connectionText =
document.getElementById("connectionText");

const chatAvatar =
document.getElementById("chatAvatar");

const chatTitle =
document.getElementById("chatTitle");

const myUsername =
document.getElementById("myUsername");

const logoutButton =
document.getElementById("logoutButton");

let username = "";
let socket = null;
let mode = "register";
let selectedUser = null;


/* MODE */

registerMode.onclick = () => {

  mode = "register";

  registerMode.classList.add("active");
  loginMode.classList.remove("active");

  loginButton.textContent = "Hesab yarat";

  loginError.textContent = "";

};

loginMode.onclick = () => {

  mode = "login";

  loginMode.classList.add("active");
  registerMode.classList.remove("active");

  loginButton.textContent = "Daxil ol";

  loginError.textContent = "";

};


/* LOGIN */

loginButton.onclick = login;

codeInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") login();
});

usernameInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") codeInput.focus();
});


async function login(){

  const user =
    usernameInput.value.trim();

  const code =
    codeInput.value.trim();

  loginError.textContent = "";

  if(!/^[A-Za-z0-9_]{3,20}$/.test(user)){

    loginError.textContent =
      "Username 3-20 simvol olmalıdır.";

    return;
  }

  if(!/^[A-Za-z0-9]{4,10}$/.test(code)){

    loginError.textContent =
      "Kod 4-10 simvol olmalıdır. Hərf və rəqəmlərdən istifadə edə bilərsən.";

    return;
  }

  loginButton.disabled = true;

  try{

    const endpoint =
      mode === "register"
      ? "/api/register"
      : "/api/login";

    const response =
      await fetch(endpoint,{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          username:user,
          code:code
        })
      });

    const data =
      await response.json();

    if(!data.ok){

      loginError.textContent =
        data.error || "Əməliyyat alınmadı.";

      return;
    }

    username =
      data.username || user;

    /*
      Hesab məlumatını brauzerdə saxlayırıq.
      Buna görə səhifə yenilənəndə login ekranı
      yenidən çıxmır.
    */

    localStorage.setItem(
      "samirchat_username",
      username
    );

    localStorage.setItem(
      "samirchat_session",
      data.session || "active"
    );

    openChat();

  }catch(e){

    loginError.textContent =
      "Serverə qoşulmaq mümkün olmadı.";

  }finally{

    loginButton.disabled = false;

  }

}


/* AUTO LOGIN */

window.addEventListener("load",()=>{

  const saved =
    localStorage.getItem(
      "samirchat_username"
    );

  const session =
    localStorage.getItem(
      "samirchat_session"
    );

  if(saved && session){

    username = saved;

    openChat();

  }

});


/* OPEN CHAT */

function openChat(){

  loginScreen.classList.add("hidden");

  chatApp.classList.remove("hidden");

  myUsername.textContent =
    "@" + username;

  chatAvatar.textContent =
    username.charAt(0).toUpperCase();

  connect();

}


/* LOGOUT */

logoutButton.onclick = ()=>{

  localStorage.removeItem(
    "samirchat_username"
  );

  localStorage.removeItem(
    "samirchat_session"
  );

  if(socket){

    socket.close();

    socket = null;

  }

  location.reload();

};


/* WEBSOCKET */

function connect(){

  const protocol =
    location.protocol === "https:"
    ? "wss:"
    : "ws:";

  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host +
      "/ws?username=" +
      encodeURIComponent(username)
    );

  socket.onopen = ()=>{

    connectionText.textContent =
      "online";

  };

  socket.onmessage = event=>{

    try{

      const data =
        JSON.parse(event.data);

      if(data.type==="welcome"){

        updateUsers(
          data.users || []
        );

      }

      if(data.type==="users"){

        updateUsers(
          data.users || []
        );

      }

      if(data.type==="message"){

        addMessage(
          data.username,
          data.text,
          data.time
        );

      }

      if(data.type==="system"){

        addSystem(data.text);

      }

    }catch(e){

      console.log(e);

    }

  };

  socket.onclose = ()=>{

    connectionText.textContent =
      "offline";

  };

}


/* SEND */

sendButton.onclick =
sendMessage;

messageInput.addEventListener(
"keydown",e=>{

  if(e.key==="Enter")
    sendMessage();

});


function sendMessage(){

  const text =
    messageInput.value.trim();

  if(!text) return;

  if(!socket ||
     socket.readyState !== WebSocket.OPEN){

    addSystem(
      "Serverlə əlaqə yoxdur."
    );

    return;

  }

  socket.send(
    JSON.stringify({
      type:"message",
      text:text,
      to:selectedUser
    })
  );

  messageInput.value = "";

}


/* MESSAGE */

function addMessage(
  sender,
  text,
  time
){

  const empty =
    document.getElementById(
      "emptyMessage"
    );

  if(empty)
    empty.remove();

  const box =
    document.createElement("div");

  box.className =
    sender === username
    ? "msg me"
    : "msg them";

  const name =
    document.createElement("div");

  name.className =
    "msgName";

  name.textContent =
    sender === username
    ? "Sən"
    : "@" + sender;

  const content =
    document.createElement("div");

  content.textContent = text;

  const timestamp =
    document.createElement("div");

  timestamp.className =
    "time";

  timestamp.textContent =
    time
    ? new Date(time).toLocaleTimeString(
        "az-AZ",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )
    : "indi";

  box.appendChild(name);
  box.appendChild(content);
  box.appendChild(timestamp);

  messages.appendChild(box);

  messages.scrollTop =
    messages.scrollHeight;

}


/* SYSTEM */

function addSystem(text){

  const box =
    document.createElement("div");

  box.className = "system";

  box.textContent = text;

  messages.appendChild(box);

}


/* USERS */

function updateUsers(users){

  usersList.innerHTML = "";

  users.forEach(user=>{

    if(user === username)
      return;

    const item =
      document.createElement("div");

    item.className = "user";

    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
      user.charAt(0).toUpperCase();

    const info =
      document.createElement("div");

    const name =
      document.createElement("b");

    name.textContent =
      "@" + user;

    const status =
      document.createElement("small");

    status.textContent =
      "online · DM üçün toxun";

    info.appendChild(name);
    info.appendChild(status);

    item.appendChild(avatar);
    item.appendChild(info);

    item.onclick = ()=>{

      selectedUser = user;

      chatTitle.textContent =
        "@" + user;

      chatAvatar.textContent =
        user.charAt(0).toUpperCase();

      messageInput.placeholder =
        "@" + user + " üçün mesaj yaz...";

      messages.innerHTML = "";

      const notice =
        document.createElement("div");

      notice.className = "notice";

      notice.textContent =
        "💜 Söhbətdə bir-birinizə qarşı hörməti qoruyun. Nalayiq sözlərdən istifadə etməyin.";

      messages.appendChild(notice);

    };

    usersList.appendChild(item);

  });

}


/* SEARCH */

searchInput.addEventListener(
"input",()=>{

  const query =
    searchInput.value
    .trim()
    .toLowerCase();

  document
  .querySelectorAll(
    "#usersList .user"
  )
  .forEach(item=>{

    item.style.display =
      item.textContent
      .toLowerCase()
      .includes(query)
      ? "flex"
      : "none";

  });

});

</script>

</body>
</html>
