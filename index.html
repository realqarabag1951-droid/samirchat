<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SamirChat</title>

<style>

:root{
  --bg:#f6f4ff;
  --card:rgba(255,255,255,.82);
  --text:#25233a;
  --muted:#817e99;
  --primary:#7c6cf2;
  --primary2:#a78bfa;
  --soft:#eeeaff;
  --online:#43d17a;
  --danger:#e05270;
  --shadow:0 18px 55px rgba(76,62,145,.13);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 10%,
      #e9e4ff 0,
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 90%,
      #ffe8f4 0,
      transparent 30%
    ),
    var(--bg);

  min-height:100vh;
}


/* =========================
   AUTH
========================= */

.auth{
  min-height:100vh;

  display:grid;
  place-items:center;

  padding:20px;
}

.authCard{
  width:min(430px,100%);

  padding:35px;

  text-align:center;

  background:var(--card);

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.8);

  border-radius:28px;

  box-shadow:var(--shadow);
}

.logoBig{
  width:68px;
  height:68px;

  margin:0 auto 18px;

  display:grid;
  place-items:center;

  border-radius:21px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:white;

  font-size:30px;
  font-weight:900;
}

.authCard h1{
  margin:0 0 8px;
}

.authCard p{
  color:var(--muted);
  margin-bottom:25px;
}

.input{
  width:100%;

  padding:15px;

  border:0;
  outline:0;

  background:#f1effa;

  border-radius:16px;

  font-size:16px;

  margin-bottom:10px;
}

.authButton{
  width:100%;

  border:0;

  padding:16px;

  border-radius:16px;

  background:var(--primary);

  color:white;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

  margin-top:5px;
}

.authButton:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.switch{
  margin-top:20px;

  color:var(--muted);

  font-size:14px;
}
