<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SamirChat</title>

<style>

:root{
  --bg:#f6f4ff;
  --card:rgba(255,255,255,.82);
  --text:#25233a;
  --muted:#817e99;
  --primary:#7c6cf2;
  --primary2:#a78bfa;
  --soft:#eeeaff;
  --online:#43d17a;
  --danger:#e05270;
  --shadow:0 18px 55px rgba(76,62,145,.13);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);

  background:
    radial-gradient(
      circle at 10% 10%,
      #e9e4ff 0,
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 90%,
      #ffe8f4 0,
      transparent 30%
    ),
    var(--bg);

  min-height:100vh;
}


/* =========================
   AUTH
========================= */

.auth{
  min-height:100vh;

  display:grid;
  place-items:center;

  padding:20px;
}

.authCard{
  width:min(430px,100%);

  padding:35px;

  text-align:center;

  background:var(--card);

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.8);

  border-radius:28px;

  box-shadow:var(--shadow);
}

.logoBig{
  width:68px;
  height:68px;

  margin:0 auto 18px;

  display:grid;
  place-items:center;

  border-radius:21px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:white;

  font-size:30px;
  font-weight:900;
}

.authCard h1{
  margin:0 0 8px;
}

.authCard p{
  color:var(--muted);
  margin-bottom:25px;
}

.input{
  width:100%;

  padding:15px;

  border:0;
  outline:0;

  background:#f1effa;

  border-radius:16px;

  font-size:16px;

  margin-bottom:10px;
}

.authButton{
  width:100%;

  border:0;

  padding:16px;

  border-radius:16px;

  background:var(--primary);

  color:white;

  font-size:16px;

  font-weight:800;

  cursor:pointer;

  margin-top:5px;
}

.authButton:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.switch{
  margin-top:20px;

  color:var(--muted);

  font-size:14px;
}

.switch button{
  border:0;
  background:none;

  color:var(--primary);

  font-weight:800;

  cursor:pointer;

  font-size:14px;
}

.error{
  min-height:20px;

  margin:4px 0 4px;

  color:var(--danger);

  font-size:14px;
}


/* =========================
   APP
========================= */

.app{
  max-width:1180px;

  margin:auto;

  padding:24px;
}

header{
  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:16px 20px;

  margin-bottom:20px;

  background:var(--card);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.8);

  border-radius:24px;

  box-shadow:var(--shadow);
}

.logo{
  display:flex;

  align-items:center;

  gap:12px;

  font-weight:800;

  font-size:23px;
}

.logoMark{
  width:43px;
  height:43px;

  border-radius:15px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  color:white;
}

.headerRight{
  display:flex;

  align-items:center;

  gap:10px;
}

.tiktok{
  color:#fff;

  text-decoration:none;

  background:#191827;

  padding:11px 16px;

  border-radius:14px;

  font-weight:700;
}

.logout{
  border:0;

  background:#eeeaf8;

  color:var(--text);

  padding:11px 14px;

  border-radius:14px;

  font-weight:700;

  cursor:pointer;
}


/* =========================
   LAYOUT
========================= */

.layout{
  display:grid;

  grid-template-columns:330px 1fr;

  gap:20px;
}

.panel,
.chat{
  background:var(--card);

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.8);

  box-shadow:var(--shadow);

  border-radius:26px;
}

.panel{
  padding:20px;
}

.search{
  width:100%;

  padding:14px 16px;

  border:0;
  outline:0;

  background:#f1effa;

  border-radius:15px;

  font-size:15px;
}

.title{
  display:flex;

  align-items:center;

  justify-content:space-between;

  margin:20px 0 12px;

  font-weight:800;
}

.onlineCount{
  color:var(--online);

  font-size:12px;
}

.user{
  display:flex;

  align-items:center;

  gap:12px;

  padding:13px;

  border-radius:17px;
}

.user:hover{
  background:var(--soft);
}

.avatar{
  width:45px;
  height:45px;

  min-width:45px;

  border-radius:15px;

  display:grid;

  place-items:center;

  color:white;

  font-weight:800;

  background:
    linear-gradient(
      135deg,
      #8b7cf6,
      #c59cff
    );

  position:relative;
}

.onlineDot{
  position:absolute;

  width:11px;
  height:11px;

  border-radius:50%;

  background:var(--online);

  right:-2px;
  bottom:-2px;

  border:2px solid white;
}

.userName{
  font-weight:800;
}

.userStatus{
  color:var(--muted);

  font-size:12px;

  margin-top:3px;
}

.emptyUsers{
  color:var(--muted);

  padding:15px 5px;

  text-align:center;

  font-size:14px;
}


/* =========================
   CHAT
========================= */

.chat{
  min-height:650px;

  display:flex;

  flex-direction:column;

  overflow:hidden;
}

.chatHead{
  padding:20px 24px;

  border-bottom:1px solid #eeeaf8;

  display:flex;

  align-items:center;

  gap:13px;
}

.connection{
  color:var(--muted);

  font-size:13px;
}

.messages{
  flex:1;

  padding:28px;

  display:flex;

  flex-direction:column;

  gap:13px;

  overflow-y:auto;
}

.msg{
  max-width:65%;

  padding:13px 16px;

  border-radius:19px;

  line-height:1.4;

  word-break:break-word;
}

.them{
  background:#eeeaf9;

  align-self:flex-start;

  border-bottom-left-radius:6px;
}

.me{
  background:
    linear-gradient(
      135deg,
      var(--primary),
      #9b82f7
    );

  color:white;

  align-self:flex-end;

  border-bottom-right-radius:6px;
}

.msgName{
  font-size:12px;

  font-weight:800;

  margin-bottom:4px;

  opacity:.7;
}

.time{
  font-size:11px;

  opacity:.62;

  margin-top:4px;
}

.system{
  align-self:center;

  color:var(--muted);

  font-size:12px;

  text-align:center;
}

.welcome{
  margin:auto;

  text-align:center;

  color:var(--muted);
}

.welcomeIcon{
  font-size:55px;
}

.composer{
  display:flex;

  gap:10px;

  padding:17px;

  border-top:1px solid #eeeaf8;
}

.composer input{
  flex:1;

  border:0;

  outline:0;

  background:#f1effa;

  border-radius:16px;

  padding:14px;

  font-size:15px;
}

.send{
  border:0;

  color:white;

  background:var(--primary);

  padding:0 20px;

  border-radius:16px;

  font-weight:800;

  cursor:pointer;
}

.send:disabled{
  opacity:.5;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .panel{
    display:block;
  }

  .chat{
    min-height:70vh;
  }

  .app{
    padding:12px;
  }

  .msg{
    max-width:82%;
  }

  .headerRight{
    gap:5px;
  }

  .tiktok{
    padding:9px 10px;
    font-size:12px;
  }

  .logout{
    padding:9px 10px;
    font-size:12px;
  }

}

</style>
</head>


<body>


<!-- =========================
     LOGIN / REGISTER
========================= -->

<section
  class="auth"
  id="authScreen"
>

  <div class="authCard">

    <div class="logoBig">
      S
    </div>

    <h1 id="authTitle">
      SamirChat
    </h1>

    <p id="authDescription">
      Username və kod ilə hesabına daxil ol.
    </p>


    <input
      id="usernameInput"
      class="input"
      maxlength="20"
      autocomplete="username"
      placeholder="Username"
    >


    <input
      id="codeInput"
      class="input"
      type="password"
      inputmode="numeric"
      maxlength="6"
      autocomplete="current-password"
      placeholder="4-6 rəqəmli kod"
    >


    <!-- Yalnız qeydiyyat zamanı görünür -->

    <input
      id="codeAgainInput"
      class="input"
      type="password"
      inputmode="numeric"
      maxlength="6"
      autocomplete="new-password"
      placeholder="Kodu təkrar yaz"
      style="display:none"
    >


    <div
      id="authError"
      class="error"
    ></div>


    <button
      id="authButton"
      class="authButton"
    >
      Daxil ol
    </button>


    <div class="switch">

      <span id="switchText">
        Hesabın yoxdur?
      </span>

      <button
        id="switchButton"
      >
        Hesab yarat
      </button>

    </div>

  </div>

</section>



<!-- =========================
     CHAT APP
========================= -->

<div
  class="app"
  id="chatApp"
  style="display:none"
>

<header>

  <div class="logo">

    <div class="logoMark">
      S
    </div>

    SamirChat

  </div>


  <div class="headerRight">

    <a
      class="tiktok"
      href="https://www.tiktok.com/@ssamirreds"
      target="_blank"
      rel="noopener"
    >
      TikTok · @ssamirreds
    </a>


    <button
      class="logout"
      id="logoutButton"
    >
      Çıxış
    </button>

  </div>

</header>



<div class="layout">


<!-- =========================
     USERS
========================= -->

<aside class="panel">

  <input
    id="searchInput"
    class="search"
    placeholder="🔎 Username axtar..."
    autocomplete="off"
  >


  <div class="title">

    <span>
      Online istifadəçilər
    </span>

    <span
      id="onlineCount"
      class="onlineCount"
    >
      0
    </span>

  </div>


  <div id="usersList">

    <div class="emptyUsers">
      Hazırda heç kim online deyil.
    </div>

  </div>

</aside>



<!-- =========================
     CHAT
========================= -->

<main class="chat">


  <div class="chatHead">

    <div
      class="avatar"
      id="myAvatar"
    >

      S

      <span
        class="onlineDot"
      ></span>

    </div>


    <div>

      <b id="myUsername">
        SamirChat
      </b>


      <div class="connection">

        <span
          id="connectionText"
        >
          qoşulur...
        </span>

        <span class="onlineDot"
          style="
            position:static;
            display:inline-block;
            margin-left:4px;
          "
        ></span>

      </div>

    </div>

  </div>



  <div
    class="messages"
    id="messages"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcomeIcon">
        💬
      </div>

      <h2>
        SamirChat-a xoş gəlmisən
      </h2>

      <p>
        Online istifadəçilərlə real vaxtda söhbət et.
      </p>

    </div>

  </div>



  <div class="composer">

    <input
      id="messageInput"
      maxlength="500"
      autocomplete="off"
      placeholder="Mesaj yaz..."
    >


    <button
      id="sendButton"
      class="send"
    >
      Göndər
    </button>

  </div>

</main>

</div>

</div>



<script>

/* =====================================================
   ELEMENTS
===================================================== */

const authScreen =
  document.getElementById(
    "authScreen"
  );

const chatApp =
  document.getElementById(
    "chatApp"
  );

const authTitle =
  document.getElementById(
    "authTitle"
  );

const authDescription =
  document.getElementById(
    "authDescription"
  );

const usernameInput =
  document.getElementById(
    "usernameInput"
  );

const codeInput =
  document.getElementById(
    "codeInput"
  );

const codeAgainInput =
  document.getElementById(
    "codeAgainInput"
  );

const authButton =
  document.getElementById(
    "authButton"
  );

const authError =
  document.getElementById(
    "authError"
  );

const switchButton =
  document.getElementById(
    "switchButton"
  );

const switchText =
  document.getElementById(
    "switchText"
  );

const logoutButton =
  document.getElementById(
    "logoutButton"
  );

const messageInput =
  document.getElementById(
    "messageInput"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const messages =
  document.getElementById(
    "messages"
  );

const usersList =
  document.getElementById(
    "usersList"
  );

const onlineCount =
  document.getElementById(
    "onlineCount"
  );

const searchInput =
  document.getElementById(
    "searchInput"
  );

const connectionText =
  document.getElementById(
    "connectionText"
  );

const myUsername =
  document.getElementById(
    "myUsername"
  );

const myAvatar =
  document.getElementById(
    "myAvatar"
  );


/* =====================================================
   VARIABLES
===================================================== */

let username = "";

let socket = null;

let registerMode = false;


/* =====================================================
   AUTH MODE
===================================================== */

switchButton.addEventListener(
  "click",
  () => {

    registerMode =
      !registerMode;

    authError.textContent =
      "";

    codeInput.value =
      "";

    codeAgainInput.value =
      "";


    if(registerMode){

      authTitle.textContent =
        "Hesab yarat";

      authDescription.textContent =
        "Username və öz giriş kodunu seç.";

      codeInput.placeholder =
        "4-6 rəqəmli kod";

      codeAgainInput.style.display =
        "block";

      authButton.textContent =
        "Hesab yarat";

      switchText.textContent =
        "Artıq hesabın var?";

      switchButton.textContent =
        "Daxil ol";

    }else{

      authTitle.textContent =
        "SamirChat";

      authDescription.textContent =
        "Username və kod ilə hesabına daxil ol.";

      codeAgainInput.style.display =
        "none";

      authButton.textContent =
        "Daxil ol";

      switchText.textContent =
        "Hesabın yoxdur?";

      switchButton.textContent =
        "Hesab yarat";

    }

  }
);


/* =====================================================
   AUTH BUTTON
===================================================== */

authButton.addEventListener(
  "click",
  handleAuth
);


usernameInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){
      handleAuth();
    }

  }
);


codeInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){
      handleAuth();
    }

  }
);


codeAgainInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){
      handleAuth();
    }

  }
);


/* =====================================================
   REGISTER / LOGIN
===================================================== */

async function handleAuth(){

  const user =
    usernameInput.value.trim();

  const code =
    codeInput.value.trim();


  authError.textContent =
    "";


  if(
    !/^[A-Za-z0-9_]{3,20}$/.test(user)
  ){

    authError.textContent =
      "Username 3-20 simvol olmalıdır. Yalnız hərf, rəqəm və _ istifadə et.";

    return;
  }


  if(
    !/^\d{4,6}$/.test(code)
  ){

    authError.textContent =
      "Kod 4-6 rəqəmdən ibarət olmalıdır.";

    return;
  }


  if(registerMode){

    const again =
      codeAgainInput.value.trim();


    if(code !== again){

      authError.textContent =
        "Kodlar eyni deyil.";

      return;
    }

  }


  authButton.disabled =
    true;


  authButton.textContent =
    registerMode
      ? "Hesab yaradılır..."
      : "Daxil olunur...";


  try{

    const endpoint =
      registerMode
        ? "/api/register"
        : "/api/login";


    const response =
      await fetch(
        endpoint,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            username:user,
            code:code
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.ok){

      authError.textContent =
        data.error ||
        "Əməliyyat mümkün olmadı.";

      return;
    }


    username =
      data.username;


    /*
     * Hesabı browserdə saxla.
     *
     * Refresh edəndə yenidən
     * login lazım olmayacaq.
     */
    localStorage.setItem(
      "samirchat_username",
      username
    );


    openChat();

  }catch(error){

    console.error(error);

    authError.textContent =
      "Serverə qoşulmaq mümkün olmadı.";

  }finally{

    authButton.disabled =
      false;

    authButton.textContent =
      registerMode
        ? "Hesab yarat"
        : "Daxil ol";

  }

}


/* =====================================================
   AUTO LOGIN
===================================================== */

window.addEventListener(
  "load",
  () => {

    const savedUsername =
      localStorage.getItem(
        "samirchat_username"
      );


    if(savedUsername){

      username =
        savedUsername;

      openChat();

    }

  }
);


/* =====================================================
   OPEN CHAT
===================================================== */

function openChat(){

  authScreen.style.display =
    "none";

  chatApp.style.display =
    "block";


  myUsername.textContent =
    "@" + username;


  myAvatar.childNodes[0].textContent =
    username
      .charAt(0)
      .toUpperCase();


  connectWebSocket();

}


/* =====================================================
   WEBSOCKET
===================================================== */

function connectWebSocket(){

  if(socket){

    try{
      socket.close();
    }catch{}

  }


  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  const url =
    protocol +
    "//" +
    location.host +
    "/ws?username=" +
    encodeURIComponent(
      username
    );


  socket =
    new WebSocket(url);


  socket.addEventListener(
    "open",
    () => {

      connectionText.textContent =
        "online";

    }
  );


  socket.addEventListener(
    "message",
    event => {

      try{

        const data =
          JSON.parse(
            event.data
          );


        if(
          data.type === "welcome"
        ){

          updateUsers(
            data.users || []
          );

        }


        if(
          data.type === "users"
        ){

          updateUsers(
            data.users || []
          );

        }


        if(
          data.type === "message"
        ){

          addMessage(
            data.username,
            data.text,
            data.time
          );

        }


        if(
          data.type === "system"
        ){

          addSystem(
            data.text
          );

        }

      }catch(error){

        console.error(error);

      }

    }
  );


  socket.addEventListener(
    "close",
    () => {

      connectionText.textContent =
        "offline";

    }
  );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){

      e.preventDefault();

      sendMessage();

    }

  }
);


function sendMessage(){

  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  if(
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ){

    addSystem(
      "Serverə qoşulu deyilsən."
    );

    return;
  }


  socket.send(
    JSON.stringify({
      type:"message",
      text:text
    })
  );


  messageInput.value =
    "";

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  sender,
  text,
  timestamp
){

  const welcome =
    document.getElementById(
      "welcome"
    );


  if(welcome){
    welcome.remove();
  }


  const box =
    document.createElement(
      "div"
    );


  box.className =
    sender === username
      ? "msg me"
      : "msg them";


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "msgName";

  name.textContent =
    sender === username
      ? "Sən"
      : "@" + sender;


  const content =
    document.createElement(
      "div"
    );

  content.textContent =
    text;


  const time =
    document.createElement(
      "div"
    );

  time.className =
    "time";


  time.textContent =
    timestamp
      ? new Date(
          tim
