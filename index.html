<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SamirChat</title>

<style>
:root{
  --bg:#f6f4ff;
  --card:rgba(255,255,255,.82);
  --text:#25233a;
  --muted:#817e99;
  --primary:#7c6cf2;
  --primary2:#a78bfa;
  --soft:#eeeaff;
  --online:#43d17a;
  --danger:#e05270;
  --shadow:0 18px 55px rgba(76,62,145,.13);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);

  background:
    radial-gradient(circle at 10% 10%,#e9e4ff 0,transparent 32%),
    radial-gradient(circle at 90% 90%,#ffe8f4 0,transparent 30%),
    var(--bg);

  min-height:100vh;
}


/* LOGIN */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginCard{
  width:min(430px,100%);
  background:var(--card);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:28px;
  padding:35px;
  box-shadow:var(--shadow);
  text-align:center;
}

.loginLogo{
  width:65px;
  height:65px;
  border-radius:20px;
  display:grid;
  place-items:center;
  margin:0 auto 18px;

  background:
    linear-gradient(135deg,var(--primary),var(--primary2));

  color:white;
  font-size:30px;
  font-weight:900;
}

.loginCard h1{
  margin:0 0 8px;
}

.loginCard p{
  color:var(--muted);
  margin-bottom:25px;
}

.usernameInput{
  width:100%;
  padding:16px;

  border:0;
  outline:0;

  background:#f1effa;
  border-radius:16px;

  font-size:16px;
  margin-bottom:12px;
}

.loginButton{
  width:100%;
  border:0;
  padding:16px;

  border-radius:16px;

  background:var(--primary);
  color:white;

  font-size:16px;
  font-weight:800;

  cursor:pointer;
}

.loginButton:disabled{
  opacity:.6;
}

.error{
  color:var(--danger);
  font-size:14px;
  min-height:20px;
  margin-bottom:8px;
}


/* APP */

.app{
  max-width:1180px;
  margin:auto;
  padding:24px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:16px 20px;
  margin-bottom:20px;

  background:var(--card);
  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;

  box-shadow:var(--shadow);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;

  font-weight:800;
  font-size:23px;
}

.logoMark{
  width:43px;
  height:43px;
  border-radius:15px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(135deg,var(--primary),var(--primary2));

  color:white;
}

.tiktok{
  color:#fff;
  text-decoration:none;

  background:#191827;

  padding:11px 16px;

  border-radius:14px;

  font-weight:700;
}


/* LAYOUT */

.layout{
  display:grid;
  grid-template-columns:330px 1fr;
  gap:20px;
}

.panel,
.chat{
  background:var(--card);
  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.8);

  box-shadow:var(--shadow);

  border-radius:26px;
}

.panel{
  padding:20px;
}

.search{
  width:100%;
  padding:14px 16px;

  border:0;
  outline:0;

  background:#f1effa;

  border-radius:15px;

  font-size:15px;
}

.title{
  margin:20px 0 12px;
  font-weight:800;
}


/* USERS */

.user{
  display:flex;
  align-items:center;

  gap:12px;

  padding:13px;

  border-radius:17px;

  cursor:pointer;

  transition:.15s;
}

.user:hover{
  background:var(--soft);
}

.avatar{
  width:45px;
  height:45px;

  min-width:45px;

  border-radius:15px;

  display:grid;
  place-items:center;

  color:white;

  font-weight:800;

  background:
    linear-gradient(135deg,#8b7cf6,#c59cff);
}

.userInfo{
  min-width:0;
  flex:1;
}

.userInfo b{
  display:block;
}

.userInfo small{
  color:var(--muted);
}

.dmButton{
  border:0;

  background:var(--primary);

  color:white;

  padding:7px 10px;

  border-radius:10px;

  font-size:12px;

  font-weight:700;

  cursor:pointer;
}


/* CHAT */

.chat{
  min-height:650px;

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.chatHead{
  padding:20px 24px;

  border-bottom:1px solid #eeeaf8;

  display:flex;
  align-items:center;

  gap:13px;
}

.chatTitle{
  font-weight:800;
}

.chatSubtitle{
  color:var(--muted);
  font-size:13px;
}

.dot{
  width:10px;
  height:10px;

  border-radius:50%;

  background:var(--online);

  display:inline-block;

  margin-left:4px;
}


/* MESSAGES */

.messages{
  flex:1;

  padding:28px;

  display:flex;
  flex-direction:column;

  gap:13px;

  overflow-y:auto;
}

.msg{
  max-width:65%;

  padding:13px 16px;

  border-radius:19px;

  line-height:1.4;

  word-break:break-word;
}

.them{
  background:#eeeaf9;

  align-self:flex-start;

  border-bottom-left-radius:6px;
}

.me{
  background:
    linear-gradient(135deg,var(--primary),#9b82f7);

  color:white;

  align-self:flex-end;

  border-bottom-right-radius:6px;
}

.msgName{
  font-size:12px;
  font-weight:800;

  margin-bottom:4px;

  opacity:.7;
}

.time{
  font-size:11px;

  opacity:.62;

  margin-top:4px;
}

.system{
  align-self:center;

  color:var(--muted);

  font-size:12px;

  text-align:center;

  padding:6px 10px;
}

.welcome{
  margin:auto;

  text-align:center;

  padding:30px;

  color:var(--muted);
}

.welcomeIcon{
  font-size:55px;
}


/* COMPOSER */

.composer{
  display:flex;

  gap:10px;

  padding:17px;

  border-top:1px solid #eeeaf8;
}

.composer input{
  flex:1;

  border:0;
  outline:0;

  background:#f1effa;

  border-radius:16px;

  padding:14px;

  font-size:15px;
}

.send{
  border:0;

  color:white;

  background:var(--primary);

  padding:0 20px;

  border-radius:16px;

  font-weight:800;

  cursor:pointer;
}

.send:disabled{
  opacity:.5;
}


/* DM BADGE */

.dmMode{
  display:inline-flex;

  align-items:center;

  gap:6px;

  background:#eeeaff;

  color:#6456d8;

  padding:5px 9px;

  border-radius:10px;

  font-size:11px;

  font-weight:800;

  margin-top:4px;
}


/* MOBILE */

@media(max-width:800px){

  .layout{
    grid-template-columns:1fr;
  }

  .panel{
    display:block;
  }

  .chat{
    min-height:70vh;
  }

  .app{
    padding:12px;
  }

  .msg{
    max-width:82%;
  }

  .tiktok{
    padding:9px 11px;
    font-size:13px;
  }

}
</style>
</head>


<body>


<!-- LOGIN -->

<section class="login" id="loginScreen">

  <div class="loginCard">

    <div class="loginLogo">
      S
    </div>

    <h1>SamirChat</h1>

    <p>
      Username seç və dostlarınla real vaxtda söhbət et.
    </p>

    <input
      id="usernameInput"
      class="usernameInput"
      maxlength="20"
      autocomplete="off"
      placeholder="Username daxil et..."
    >

    <div
      id="loginError"
      class="error">
    </div>

    <button
      id="loginButton"
      class="loginButton">
      Çata daxil ol
    </button>

  </div>

</section>



<!-- MAIN APP -->

<div
  class="app"
  id="chatApp"
  style="display:none"
>

<header>

  <div class="logo">

    <div class="logoMark">
      S
    </div>

    SamirChat

  </div>


  <a
    class="tiktok"
    href="https://www.tiktok.com/@ssamirreds"
    target="_blank"
    rel="noopener"
  >
    TikTok · @ssamirreds
  </a>

</header>



<div class="layout">


<!-- USERS PANEL -->

<aside class="panel">

  <input
    id="searchInput"
    class="search"
    placeholder="🔎 Username axtar..."
    autocomplete="off"
  >


  <div class="title">
    Online istifadəçilər
  </div>


  <div id="usersList"></div>

</aside>



<!-- CHAT -->

<main class="chat">


  <div class="chatHead">

    <div
      class="avatar"
      id="chatAvatar"
    >
      S
    </div>


    <div>

      <div
        class="chatTitle"
        id="chatTitle"
      >
        Ümumi söhbət
      </div>


      <div
        class="chatSubtitle"
        id="chatSubtitle"
      >
        online
        <span class="dot"></span>
      </div>

    </div>

  </div>



  <div
    class="messages"
    id="messages"
  >

    <div
      class="welcome"
      id="welcome"
    >

      <div class="welcomeIcon">
        💬
      </div>

      <h2>
        SamirChat-a xoş gəlmisən
      </h2>

      <p>
        Dostlarınla söhbət et.
      </p>

    </div>

  </div>



  <div class="composer">

    <input
      id="messageInput"
      maxlength="500"
      autocomplete="off"
      placeholder="Mesaj yaz..."
    >

    <button
      class="send"
      id="sendButton"
    >
      Göndər
    </button>

  </div>

</main>

</div>

</div>



<script>


/* ELEMENTS */

const loginScreen =
  document.getElementById("loginScreen");

const chatApp =
  document.getElementById("chatApp");

const usernameInput =
  document.getElementById("usernameInput");

const loginButton =
  document.getElementById("loginButton");

const loginError =
  document.getElementById("loginError");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const messages =
  document.getElementById("messages");

const usersList =
  document.getElementById("usersList");

const searchInput =
  document.getElementById("searchInput");

const chatAvatar =
  document.getElementById("chatAvatar");

const chatTitle =
  document.getElementById("chatTitle");

const chatSubtitle =
  document.getElementById("chatSubtitle");


let username = "";

let socket = null;

let currentDM = null;



/* BAD WORD FILTER */

const badWords = [

  "sik",
  "siktir",
  "amk",
  "aq",
  "orospu",
  "göt",
  "got",
  "piç",
  "pic",
  "fuck",
  "shit"

];


function containsBadWord(text){

  const lower =
    text.toLowerCase();

  return badWords.some(
    word =>
      lower.includes(word)
  );

}



/* LOGIN */

loginButton.addEventListener(
  "click",
  login
);


usernameInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){
      login();
    }

  }
);



async function login(){

  const value =
    usernameInput.value.trim();


  loginError.textContent = "";


  if(
    !/^[A-Za-z0-9_]{3,20}$/
      .test(value)
  ){

    loginError.textContent =
      "Username 3-20 simvol olmalıdır. Yalnız hərf, rəqəm və _ istifadə et.";

    return;

  }


  loginButton.disabled = true;

  loginButton.textContent =
    "Yoxlanılır...";


  try{

    const response =
      await fetch(
        "/api/register",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            username:value
          })

        }
      );


    const data =
      await response.json();


    if(!data.ok){

      loginError.textContent =
        data.error ||
        "Bu username istifadə edilə bilmir.";

      return;

    }


    username =
      data.username;


    localStorage.setItem(
      "samirchat_username",
      username
    );


    chatAvatar.textContent =
      username
        .charAt(0)
        .toUpperCase();


    loginScreen.style.display =
      "none";


    chatApp.style.display =
      "block";


    connect();

  }

  catch(error){

    loginError.textContent =
      "Serverə qoşulmaq mümkün olmadı.";

  }

  finally{

    loginButton.disabled =
      false;

    loginButton.textContent =
      "Çata daxil ol";

  }

}



/* AUTO LOGIN */

const savedUsername =
  localStorage.getItem(
    "samirchat_username"
  );


if(savedUsername){

  username =
    savedUsername;


  loginScreen.style.display =
    "none";


  chatApp.style.display =
    "block";


  chatAvatar.textContent =
    username
      .charAt(0)
      .toUpperCase();


  connect();

}



/* WEBSOCKET */

function connect(){

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host +
      "/ws?username=" +
      encodeURIComponent(username)
    );


  socket.addEventListener(
    "open",
    () => {

      chatSubtitle.innerHTML =
        'online <span class="dot"></span>';

    }
  );


  socket.addEventListener(
    "message",
    event => {

      try{

        const data =
          JSON.parse(event.data);


        if(
          data.type === "welcome"
        ){

          updateUsers(
            data.users || []
          );

        }


        if(
          data.type === "users"
        ){

          updateUsers(
            data.users || []
          );

        }


        if(
          data.type === "message"
        ){

          if(!currentDM){

            addMessage(
              data.username,
              data.text,
              data.time
            );

          }

        }


        if(
          data.type === "dm"
        ){

          handleDM(data);

        }


        if(
          data.type === "system"
        ){

          if(!currentDM){

            addSystem(
              data.text
            );

          }

        }

      }

      catch(error){

        console.log(error);

      }

    }
  );


  socket.addEventListener(
    "close",
    () => {

      chatSubtitle.textContent =
        "offline";

    }
  );

}



/* USERS */

function updateUsers(users){

  usersList.innerHTML = "";


  const filtered =
    users.filter(
      user =>
        user !== username
    );


  if(filtered.length === 0){

    usersList.innerHTML =
      `<div style="
        color:var(--muted);
        padding:12px;
      ">
        Hazırda başqa istifadəçi online deyil.
      </div>`;

    return;

  }


  filtered.forEach(
    user => {

      const item =
        document.createElement("div");

      item.className =
        "user";


      const avatar =
        document.createElement("div");

      avatar.className =
        "avatar";

      avatar.textContent =
        user
          .charAt(0)
          .toUpperCase();


      const info =
        document.createElement("div");

      info.className =
        "userInfo";


      const name =
        document.createElement("b");

      name.textContent =
        "@" + user;


      const status =
        document.createElement("small");

      status.textContent =
        "🟢 online";


      info.appendChild(name);

      info.appendChild(status);


      const button =
        document.createElement("button");

      button.className =
        "dmButton";

      button.textContent =
        "DM";


      button.onclick =
        () => openDM(user);


      item.appendChild(avatar);

      item.appendChild(info);

      item.appendChild(button);


      usersList.appendChild(item);

    }
  );

}



/* SEARCH */

searchInput.addEventListener(
  "input",
  () => {

    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    document
      .querySelectorAll(
        "#usersList .user"
      )
      .forEach(item => {

        item.style.display =
          item.textContent
            .toLowerCase()
            .includes(query)
              ? "flex"
              : "none";

      });

  }
);



/* OPEN DM */

function openDM(user){

  currentDM =
    user;


  chatAvatar.textContent =
    user
      .charAt(0)
      .toUpperCase();


  chatTitle.textContent =
    "@" + user;


  chatSubtitle.innerHTML =
    "🔒 Şəxsi söhbət";


  messages.innerHTML = "";


  addSystem(
    "⚠️ Bu söhbətdə bir-birinizə qarşı hörmətli olun. Nalayıq sözlərdən istifadə etməyin."
  );


  addSystem(
    "🔒 Bu, @" +
    user +
    " ilə şəxsi söhbətdir."
  );


  messageInput.placeholder =
    "@" +
    user +
    " üçün mesaj yaz...";


  messageInput.focus();

}



/* GENERAL CHAT */

function openGeneralChat(){

  currentDM =
    null;


  chatAvatar.textContent =
    username
      .charAt(0)
      .toUpperCase();


  chatTitle.textContent =
    "Ümumi söhbət";


  chatSubtitle.innerHTML =
    'online <span class="dot"></span>';


  messages.innerHTML = "";


  const welcome =
    document.createElement("div");

  welcome.className =
    "welcome";


  welcome.innerHTML = `
    <div class="welcomeIcon">💬</div>
    <h2>Ümumi söhbət</h2>
    <p>Dostlarınla burada söhbət et.</p>
  `;


  messages.appendChild(
    welcome
  );


  messageInput.placeholder =
    "Mesaj yaz...";

}



/* SEND */

sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  e => {

    if(e.key === "Enter"){

      sendMessage();

    }

  }
);



function sendMessage(){

  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  /* BAD WORD */

  if(
    containsBadWord(text)
  ){

    addSystem(
      "⚠️ Zəhmət olmasa nalayıq sözlərdən istifadə etmə."
    );

    messageInput.value = "";

    return;

  }


  if(
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ){

    addSystem(
      "Serverlə əlaqə yoxdur."
    );

    return;

  }


  /* DM */

  if(currentDM){

    socket.send(
      JSON.stringify({

        type:"dm",

        to:currentDM,

        text:text

      })
    );

  }

  /* GENERAL CHAT */

  else{

    socket.send(
      JSON.stringify({

        type:"message",

        text:text

      })
    );

  }


  messageInput.value = "";

  messageInput.focus();

}



/* DM RECEIVE */

function handleDM(data){

  const otherUser =
    data.from === username
      ? data.to
      : data.from;


  /*
   * Yalnız həmin DM açıqdırsa
   * mesajı ekranda göstəririk.
   */

  if(
    currentDM &&
    otherUser.toLowerCase() ===
      currentDM.toLowerCase()
  ){

    addMessage(
      data.from,
      data.text,
      data.time
    );

    return;

  }


  /*
   * Başqa istifadəçidən DM gələndə
   * xəbərdarlıq göstər.
   */

  addSystem(
    "📩 @" +
    data.from +
    " sənə şəxsi mesaj göndərdi."
  );

}



/* MESSAGE */

function addMessage(
  sender,
  text,
  timestamp
){

  const box =
    document.createElement("div");


  box.className =
    sender === username
      ? "msg me"
      : "msg them";


  const name =
    document.createElement("div");

  name.className =
    "msgName";


  name.textContent =
    sender === username
      ? "Sən"
      : "@" + sender;


  const content =
    document.createElement("div");


  content.textContent =
    text;


  const time =
    document.createElement("div");

  time.className =
    "time";


  time.textContent =
    timestamp
      ? new Date(timestamp)
          .toLocaleTimeString(
            "az-AZ",
            {
              hour:"2-digit",
              minute:"2-digit"
            }
          )
      : "indi";


  box.appendChild(name);

  box.appendChild(content);

  box.appendChild(time);


  messages.appendChild(box);


  messages.scrollTop =
    messages.scrollHeight;

}



/* SYSTEM */

function addSystem(text){

  const box =
    document.createElement("div");


  box.className =
    "system";


  box.textContent =
    text;


  messages.appendChild(box);


  messages.scrollTop =
    messages.scrollHeight;

}


</script>

</body>
  </html>
