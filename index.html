<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SamirChat</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1ff;
  color:#29263d;
}

button,input{
  font-family:inherit;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:24px;
  box-shadow:0 15px 45px rgba(60,40,120,.15);
  text-align:center;
}

.logo{
  width:65px;
  height:65px;
  margin:0 auto 15px;
  border-radius:20px;
  background:#7567e8;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold;
}

h1{
  margin:5px 0 8px;
}

.description{
  color:#888;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border:0;
  outline:0;
  border-radius:14px;
  background:#f0eef8;
  font-size:16px;
}

.mainButton{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#7567e8;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.mode{
  margin-top:18px;
  color:#888;
  font-size:14px;
}

.mode button{
  border:0;
  background:none;
  color:#7567e8;
  font-weight:bold;
  cursor:pointer;
}

.error{
  color:#e04d68;
  min-height:20px;
  margin-bottom:8px;
  font-size:14px;
}

#app{
  display:none;
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.header{
  background:white;
  padding:15px 20px;
  border-radius:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.header h2{
  margin:0;
}

.logout{
  border:0;
  padding:10px 15px;
  border-radius:12px;
  background:#eeeafa;
  cursor:pointer;
}

.chat{
  height:75vh;
  background:white;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.chatHeader{
  padding:18px 20px;
  border-bottom:1px solid #eee;
  font-weight:bold;
}

.status{
  color:#888;
  font-size:13px;
  margin-top:4px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.message{
  margin-bottom:12px;
  max-width:75%;
  padding:12px 15px;
  border-radius:16px;
  background:#eeeafa;
}

.message.me{
  margin-left:auto;
  background:#7567e8;
  color:white;
}

.name{
  font-size:12px;
  font-weight:bold;
  margin-bottom:4px;
}

.system{
  text-align:center;
  color:#999;
  font-size:13px;
  margin:10px;
}

.composer{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid #eee;
}

.composer input{
  margin:0;
}

.send{
  border:0;
  background:#7567e8;
  color:white;
  padding:0 20px;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:600px){
  #app{
    padding:10px;
  }

  .chat{
    height:80vh;
  }

  .header h2{
    font-size:18px;
  }

  .message{
    max-width:85%;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login" id="loginScreen">

  <div class="card">

    <div class="logo">S</div>

    <h1>SamirChat</h1>

    <div class="description" id="description">
      Hesab yarat və söhbətə qoşul.
    </div>

    <input
      id="username"
      type="text"
      maxlength="20"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      id="code"
      type="text"
      maxlength="10"
      placeholder="Kod (4-10 simvol)"
      autocomplete="off"
    >

    <div class="error" id="error"></div>

    <button class="mainButton" id="authButton">
      Hesab yarat
    </button>

    <div class="mode">
      <span id="modeText">Artıq hesabın var?</span>

      <button id="modeButton">
        Hesaba daxil ol
      </button>
    </div>

  </div>

</div>


<!-- CHAT -->

<div id="app">

  <div class="header">

    <h2>💬 SamirChat</h2>

    <button class="logout" id="logout">
      Çıxış
    </button>

  </div>

  <div class="chat">

    <div class="chatHeader">

      Ümumi söhbət

      <div class="status" id="status">
        Serverə qoşulur...
      </div>

    </div>

    <div class="messages" id="messages">

      <div class="system">
        SamirChat-a xoş gəlmisən!
      </div>

    </div>

    <div class="composer">

      <input
        id="message"
        type="text"
        maxlength="500"
        placeholder="Mesaj yaz..."
        autocomplete="off"
      >

      <button class="send" id="send">
        Göndər
      </button>

    </div>

  </div>

</div>


<script>

let username = "";
let token = "";
let socket = null;

let loginMode = false;


/* ELEMENTS */

const loginScreen =
  document.getElementById("loginScreen");

const app =
  document.getElementById("app");

const usernameInput =
  document.getElementById("username");

const codeInput =
  document.getElementById("code");

const authButton =
  document.getElementById("authButton");

const modeButton =
  document.getElementById("modeButton");

const modeText =
  document.getElementById("modeText");

const description =
  document.getElementById("description");

const errorBox =
  document.getElementById("error");

const messages =
  document.getElementById("messages");

const messageInput =
  document.getElementById("message");

const sendButton =
  document.getElementById("send");

const status =
  document.getElementById("status");

const logoutButton =
  document.getElementById("logout");


/* REGISTER / LOGIN MODE */

modeButton.onclick = function(){

  loginMode = !loginMode;

  errorBox.textContent = "";

  if(loginMode){

    description.textContent =
      "Username və kodunla hesabına daxil ol.";

    authButton.textContent =
      "Hesaba daxil ol";

    modeText.textContent =
      "Hesabın yoxdur?";

    modeButton.textContent =
      "Hesab yarat";

  }else{

    description.textContent =
      "Hesab yarat və söhbətə qoşul.";

    authButton.textContent =
      "Hesab yarat";

    modeText.textContent =
      "Artıq hesabın var?";

    modeButton.textContent =
      "Hesaba daxil ol";

  }

};


/* AUTH */

authButton.onclick = auth;

codeInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      auth();
    }

  }
);


async function auth(){

  errorBox.textContent = "";

  const name =
    usernameInput.value.trim();

  const code =
    codeInput.value.trim();


  if(!/^[A-Za-z0-9_]{3,20}$/.test(name)){

    errorBox.textContent =
      "Username 3-20 simvol olmalıdır.";

    return;
  }


  if(!/^[A-Za-z0-9]{4,10}$/.test(code)){

    errorBox.textContent =
      "Kod 4-10 simvol olmalıdır.";

    return;
  }


  authButton.disabled = true;

  authButton.textContent =
    "Gözlə...";


  try{

    const url =
      loginMode
        ? "/api/login"
        : "/api/register";


    const response =
      await fetch(
        url,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            username:name,
            code:code
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok || !data.ok){

      errorBox.textContent =
        data.error ||
        "Əməliyyat uğursuz oldu.";

      return;
    }


    username =
      data.username;

    token =
      data.token;


    localStorage.setItem(
      "samirchat_username",
      username
    );

    localStorage.setItem(
      "samirchat_token",
      token
    );


    openApp();


  }catch(error){

    console.error(error);

    errorBox.textContent =
      "Serverə qoşulmaq mümkün olmadı.";

  }finally{

    authButton.disabled = false;

    authButton.textContent =
      loginMode
        ? "Hesaba daxil ol"
        : "Hesab yarat";

  }

}


/* OPEN APP */

function openApp(){

  loginScreen.style.display =
    "none";

  app.style.display =
    "block";

  connect();

}


/* WEBSOCKET */

function connect(){

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host +
      "/ws?token=" +
      encodeURIComponent(token)
    );


  socket.onopen = function(){

    status.textContent =
      "🟢 Serverə qoşuldun";

  };


  socket.onmessage =
    function(event){

      try{

        const data =
          JSON.parse(event.data);


        if(data.type === "message"){

          addMessage(
            data.username,
            data.text,
            data.username === username
          );

        }


        if(data.type === "system"){

          addSystem(data.text);

        }


        if(data.type === "error"){

          addSystem(
            "⚠️ " + data.error
          );

        }

      }catch(error){

        console.error(error);

      }

    };


  socket.onclose = function(){

    status.textContent =
      "🔴 Server bağlantısı kəsildi";

  };


  socket.onerror = function(){

    status.textContent =
      "🔴 Serverə qoşulmaq mümkün olmadı";

  };

}


/* SEND */

function sendMessage(){

  const text =
    messageInput.value.trim();


  if(!text){
    return;
  }


  if(
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ){

    addSystem(
      "Serverə qoşulu deyilsən."
    );

    return;
  }


  socket.send(
    JSON.stringify({
      type:"message",
      text:text
    })
  );


  messageInput.value = "";

  messageInput.focus();

}


sendButton.onclick =
  sendMessage;


messageInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      sendMessage();
    }

  }
);


/* ADD MESSAGE */

function addMessage(
  name,
  text,
  mine
){

  const div =
    document.createElement("div");

  div.className =
    "message" +
    (mine ? " me" : "");


  const nameDiv =
    document.createElement("div");

  nameDiv.className =
    "name";

  nameDiv.textContent =
    "@" + name;


  const textDiv =
    document.createElement("div");

  textDiv.textContent =
    text;


  div.appendChild(nameDiv);

  div.appendChild(textDiv);

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

}


/* SYSTEM */

function addSystem(text){

  const div =
    document.createElement("div");

  div.className =
    "system";

  div.textContent =
    text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;

}


/* LOGOUT */

logoutButton.onclick =
  function(){

    if(socket){

      try{
        socket.close();
      }catch{}

    }

    localStorage.removeItem(
      "samirchat_username"
    );

    localStorage.removeItem(
      "samirchat_token"
    );

    username = "";
    token = "";

    app.style.display =
      "none";

    loginScreen.style.display =
      "flex";

    usernameInput.value = "";
    codeInput.value = "";
    errorBox.textContent = "";

  };


/* SAVED LOGIN */

const savedUsername =
  localStorage.getItem(
    "samirchat_username"
  );

const savedToken =
  localStorage.getItem(
    "samirchat_token"
  );


if(savedUsername && savedToken){

  username =
    savedUsername;

  token =
    savedToken;

  openApp();

}

</script>

</body>
</html>
