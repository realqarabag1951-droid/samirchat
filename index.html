<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SamirChat</title>

<style>
:root{
  --bg:#f6f4ff;
  --card:rgba(255,255,255,.84);
  --text:#25233a;
  --muted:#817e99;
  --primary:#7c6cf2;
  --primary2:#a78bfa;
  --soft:#eeeaff;
  --online:#43d17a;
  --danger:#e05270;
  --shadow:0 18px 55px rgba(76,62,145,.13);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,#e9e4ff 0,transparent 32%),
    radial-gradient(circle at 90% 90%,#ffe8f4 0,transparent 30%),
    var(--bg);
  min-height:100vh;
}

/* LOGIN */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginCard{
  width:min(430px,100%);
  background:var(--card);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:28px;
  padding:35px;
  box-shadow:var(--shadow);
  text-align:center;
}

.loginLogo{
  width:65px;
  height:65px;
  border-radius:20px;
  display:grid;
  place-items:center;
  margin:0 auto 18px;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary2)
  );
  color:white;
  font-size:30px;
  font-weight:900;
}

.loginCard h1{
  margin:0 0 8px;
}

.loginCard p{
  color:var(--muted);
  margin-bottom:25px;
}

.input{
  width:100%;
  padding:16px;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:16px;
  font-size:16px;
  margin-bottom:12px;
}

.button{
  width:100%;
  border:0;
  padding:16px;
  border-radius:16px;
  background:var(--primary);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.button:disabled{
  opacity:.6;
}

.error{
  color:var(--danger);
  font-size:14px;
  min-height:20px;
  margin-bottom:10px;
}

.loginSwitch{
  margin-top:16px;
  color:var(--muted);
  font-size:14px;
}

.loginSwitch button{
  border:0;
  background:none;
  color:var(--primary);
  font-weight:800;
  cursor:pointer;
}

/* APP */

.app{
  max-width:1180px;
  margin:auto;
  padding:24px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  margin-bottom:20px;
  background:var(--card);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:23px;
