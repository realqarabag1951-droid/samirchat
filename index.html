<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SamirChat</title>

<style>
:root{
  --bg:#f6f4ff;
  --card:rgba(255,255,255,.86);
  --text:#25233a;
  --muted:#817e99;
  --primary:#7c6cf2;
  --primary2:#a78bfa;
  --soft:#eeeaff;
  --online:#43d17a;
  --danger:#e05270;
  --shadow:0 18px 55px rgba(76,62,145,.13);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,#e9e4ff 0,transparent 32%),
    radial-gradient(circle at 90% 90%,#ffe8f4 0,transparent 30%),
    var(--bg);
  min-height:100vh;
}

button,input{font-family:inherit}

/* LOGIN */

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginCard{
  width:min(430px,100%);
  background:var(--card);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:28px;
  padding:35px;
  box-shadow:var(--shadow);
  text-align:center;
}

.loginLogo{
  width:68px;
  height:68px;
  border-radius:21px;
  display:grid;
  place-items:center;
  margin:0 auto 18px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
  font-size:31px;
  font-weight:900;
}

.loginCard h1{
  margin:0 0 8px;
}

.loginCard p{
  color:var(--muted);
  margin:0 0 25px;
}

.loginInput{
  width:100%;
  padding:16px;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:16px;
  font-size:16px;
  margin-bottom:12px;
}

.primaryButton{
  width:100%;
  border:0;
  padding:16px;
  border-radius:16px;
  background:var(--primary);
  color:white;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.primaryButton:disabled{
  opacity:.6;
  cursor:wait;
}

.secondaryButton{
  width:100%;
  border:0;
  padding:14px;
  border-radius:16px;
  background:#eeeaf9;
  color:var(--text);
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

.error{
  color:var(--danger);
  font-size:14px;
  min-height:20px;
  margin:3px 0 8px;
}

.modeText{
  margin-top:18px;
  color:var(--muted);
  font-size:14px;
}

.modeButton{
  border:0;
  background:none;
  color:var(--primary);
  font-weight:800;
  cursor:pointer;
  font-size:14px;
}

/* APP */

.app{
  max-width:1180px;
  margin:auto;
  padding:24px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 20px;
  margin-bottom:20px;
  background:var(--card);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  box-shadow:var(--shadow);
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:23px;
}

.logoMark{
  width:43px;
  height:43px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  color:white;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:9px;
}

.tiktok{
  color:#fff;
  text-decoration:none;
  background:#191827;
  padding:11px 16px;
  border-radius:14px;
  font-weight:700;
}

.logout{
  border:0;
  background:#eeeaf9;
  color:var(--text);
  padding:11px 14px;
  border-radius:14px;
  font-weight:700;
  cursor:pointer;
}

.layout{
  display:grid;
  grid-template-columns:330px 1fr;
  gap:20px;
}

.panel,.chat{
  background:var(--card);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:var(--shadow);
  border-radius:26px;
}

.panel{
  padding:20px;
}

.search{
  width:100%;
  padding:14px 16px;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:15px;
  font-size:15px;
}

.title{
  margin:20px 0 12px;
  font-weight:800;
}

.user{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-radius:17px;
  cursor:pointer;
  transition:.15s;
}

.user:hover{
  background:var(--soft);
}

.user.active{
  background:#e8e3ff;
}

.avatar{
  width:45px;
  height:45px;
  min-width:45px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#8b7cf6,#c59cff);
}

.user b{display:block}
.user small{color:var(--muted)}

.onlineDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--online);
  display:inline-block;
  margin-left:5px;
}

.chat{
  min-height:650px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.chatHead{
  padding:20px 24px;
  border-bottom:1px solid #eeeaf8;
  display:flex;
  align-items:center;
  gap:13px;
}

.chatHeadInfo{flex:1}

.chatHeadTitle{font-weight:800}

.chatHeadSub{
  color:var(--muted);
  font-size:13px;
  margin-top:2px;
}

.messages{
  flex:1;
  padding:28px;
  display:flex;
  flex-direction:column;
  gap:13px;
  overflow-y:auto;
}

.msg{
  max-width:70%;
  padding:13px 16px;
  border-radius:19px;
  line-height:1.4;
  word-break:break-word;
}

.them{
  background:#eeeaf9;
  align-self:flex-start;
  border-bottom-left-radius:6px;
}

.me{
  background:linear-gradient(135deg,var(--primary),#9b82f7);
  color:white;
  align-self:flex-end;
  border-bottom-right-radius:6px;
}

.msgName{
  font-size:12px;
  font-weight:800;
  margin-bottom:4px;
  opacity:.72;
}

.time{
  font-size:11px;
  opacity:.62;
  margin-top:4px;
}

.system{
  align-self:center;
  color:var(--muted);
  font-size:12px;
  text-align:center;
  max-width:90%;
}

.notice{
  align-self:center;
  max-width:90%;
  text-align:center;
  background:#fff7d9;
  color:#77611b;
  padding:10px 14px;
  border-radius:14px;
  font-size:12px;
  margin-bottom:5px;
}

.composer{
  display:flex;
  gap:10px;
  padding:17px;
  border-top:1px solid #eeeaf8;
}

.composer input{
  flex:1;
  border:0;
  outline:0;
  background:#f1effa;
  border-radius:16px;
  padding:14px;
  font-size:15px;
}

.send{
  border:0;
  color:white;
  background:var(--primary);
  padding:0 20px;
  border-radius:16px;
  font-weight:800;
  cursor:pointer;
}

.empty{
  margin:auto;
  text-align:center;
  color:var(--muted);
}

.emptyIcon{
  font-size:55px;
  margin-bottom:10px;
}

.connectionDot{
  width:9px;
  height:9px;
  border-radius:50%;
  display:inline-block;
  background:#aaa;
  margin-left:5px;
}

.connectionDot.online{
  background:var(--online);
}

@media(max-width:800px){
  .layout{grid-template-columns:1fr}
  .panel{display:none}
  .chat{min-height:75vh}
  .app{padding:12px}
  .msg{max-width:84%}
  .tiktok{padding:9px 11px;font-size:13px}
  .logout{padding:9px 10px;font-size:12px}
  .headerRight{gap:5px}
  header{padding:12px}
  .logo{font-size:18px}
  .logoMark{width:38px;height:38px}
}
</style>
</head>

<body>

<section class="login" id="loginScreen">

  <div class="loginCard">

    <div class="loginLogo">S</div>

    <h1>SamirChat</h1>

    <p id="loginDescription">
      Hesabını yarat və dostlarınla söhbət et.
    </p>

    <input
      id="usernameInput"
      class="loginInput"
      maxlength="20"
      autocomplete="username"
      placeholder="Username"
    >

    <input
      id="codeInput"
      class="loginInput"
      maxlength="10"
      autocomplete="current-password"
      placeholder="4-10 simvolluq kod"
    >

    <div id="loginError" class="error"></div>

    <button
      id="loginButton"
      class="primaryButton"
    >
      Hesab yarat
    </button>

    <div class="modeText">

      <span id="modeQuestion">
        Artıq hesabın var?
      </span>

      <button
        id="modeButton"
        class="modeButton"
      >
        Hesaba daxil ol
      </button>

    </div>

  </div>

</section>


<div
  class="app"
  id="chatApp"
  style="display:none"
>

<header>

  <div class="logo">

    <div class="logoMark">S</div>

    SamirChat

  </div>

  <div class="headerRight">

    <a
      class="tiktok"
      href="https://www.tiktok.com/@ssamirreds"
      target="_blank"
      rel="noopener"
    >
      TikTok · @ssamirreds
    </a>

    <button
      class="logout"
      id="logoutButton"
    >
      Çıxış
    </button>

  </div>

</header>


<div class="layout">

<aside class="panel">

  <input
    id="searchInput"
    class="search"
    placeholder="🔎 Username axtar..."
    autocomplete="off"
  >

  <div class="title">
    Online istifadəçilər
  </div>

  <div id="usersList"></div>

</aside>


<main class="chat">

  <div class="chatHead">

    <div
      class="avatar"
      id="chatAvatar"
    >
      S
    </div>

    <div class="chatHeadInfo">

      <div
        class="chatHeadTitle"
        id="chatTitle"
      >
        Ümumi söhbət
      </div>

      <div
        class="chatHeadSub"
        id="chatSubtitle"
      >
        SamirChat
        <span
          id="connectionDot"
          class="connectionDot"
        ></span>
      </div>

    </div>

  </div>


  <div
    class="messages"
    id="messages"
  >

    <div class="notice">
      💜 Söhbətdə bir-birinizə qarşı olan hörməti pozmayın.
    </div>

    <div class="empty">

      <div class="emptyIcon">💬</div>

      <h2>SamirChat-a xoş gəlmisən</h2>

      <p>
        Online istifadəçi seçərək şəxsi mesajlaşmaya başlaya bilərsən.
      </p>

    </div>

  </div>


  <div class="composer">

    <input
      id="messageInput"
      maxlength="500"
      autocomplete="off"
      placeholder="Mesaj yaz..."
    >

    <button
      class="send"
      id="sendButton"
    >
      Göndər
    </button>

  </div>

</main>

</div>

</div>


<script>

let isLoginMode = false;
let username = "";
let token = "";
let socket = null;
let selectedUser = null;


/* ELEMENTS */

const loginScreen =
  document.getElementById("loginScreen");

const chatApp =
  document.getElementById("chatApp");

const usernameInput =
  document.getElementById("usernameInput");

const codeInput =
  document.getElementById("codeInput");

const loginButton =
  document.getElementById("loginButton");

const loginError =
  document.getElementById("loginError");

const loginDescription =
  document.getElementById("loginDescription");

const modeQuestion =
  document.getElementById("modeQuestion");

const modeButton =
  document.getElementById("modeButton");

const logoutButton =
  document.getElementById("logoutButton");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const messages =
  document.getElementById("messages");

const usersList =
  document.getElementById("usersList");

const searchInput =
  document.getElementById("searchInput");

const chatTitle =
  document.getElementById("chatTitle");

const chatSubtitle =
  document.getElementById("chatSubtitle");

const chatAvatar =
  document.getElementById("chatAvatar");

const connectionDot =
  document.getElementById("connectionDot");


/* MODE */

modeButton.addEventListener(
  "click",
  () => {

    isLoginMode =
      !isLoginMode;

    loginError.textContent = "";

    if(isLoginMode){

      loginDescription.textContent =
        "Username və kodunla hesabına daxil ol.";

      loginButton.textContent =
        "Hesaba daxil ol";

      modeQuestion.textContent =
        "Hesabın yoxdur?";

      modeButton.textContent =
        "Hesab yarat";

    }else{

      loginDescription.textContent =
        "Hesabını yarat və dostlarınla söhbət et.";

      loginButton.textContent =
        "Hesab yarat";

      modeQuestion.textContent =
        "Artıq hesabın var?";

      modeButton.textContent =
        "Hesaba daxil ol";
    }
  }
);


/* AUTH */

loginButton.addEventListener(
  "click",
  handleAuth
);


usernameInput.addEventListener(
  "keydown",
  e => {
    if(e.key === "Enter"){
      codeInput.focus();
    }
  }
);


codeInput.addEventListener(
  "keydown",
  e => {
    if(e.key === "Enter"){
      handleAuth();
    }
  }
);


async function handleAuth(){

  const name =
    usernameInput.value.trim();

  const code =
    codeInput.value.trim();

  loginError.textContent = "";


  if(
    !/^[A-Za-z0-9_]{3,20}$/.test(name)
  ){

    loginError.textContent =
      "Username 3-20 simvol olmalıdır.";

    return;
  }


  if(
    !/^[A-Za-z0-9]{4,10}$/.test(code)
  ){

    loginError.textContent =
      "Kod 4-10 simvol olmalıdır. Hərf və rəqəm istifadə edə bilərsən.";

    return;
  }


  loginButton.disabled = true;

  loginButton.textContent =
    "Gözlə...";


  try{

    const endpoint =
      isLoginMode
        ? "/api/login"
        : "/api/register";


    const response =
      await fetch(
        endpoint,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",
            "Accept":
              "application/json"
          },

          body:JSON.stringify({
            username:name,
            code:code
          })
        }
      );


    const text =
      await response.text();


    let data;

    try{

      data =
        JSON.parse(text);

    }catch{

      throw new Error(
        "Server cavabı düzgün deyil: " +
        text
      );
    }


    if(
      !response.ok ||
      !data.ok
    ){

      loginError.textContent =
        data.error ||
        "Əməliyyat uğursuz oldu.";

      return;
    }


    username =
      data.username;

    token =
      data.token;


    localStorage.setItem(
      "samirchat_username",
      username
    );

    localStorage.setItem(
      "samirchat_token",
      token
    );


    openChat();


  }catch(error){

    console.error(
      "AUTH ERROR:",
      error
    );

    loginError.textContent =
      error.message ||
      "Serverə qoşulmaq mümkün olmadı.";

  }finally{

    loginButton.disabled =
      false;

    loginButton.textContent =
      isLoginMode
        ? "Hesaba daxil ol"
        : "Hesab yarat";
  }
}


/* AUTO LOGIN */

function checkSavedLogin(){

  const savedUsername =
    localStorage.getItem(
      "samirchat_username"
    );

  const savedToken =
    localStorage.getItem(
      "samirchat_token"
    );


  if(
    savedUsername &&
    savedToken
  ){

    username =
      savedUsername;

    token =
      savedToken;

    openChat();
  }
}


/* OPEN */

function openChat(){

  loginScreen.style.display =
    "none";

  chatApp.style.display =
    "block";


  chatAvatar.textContent =
    username
      .charAt(0)
      .toUpperCase();


  connect();
}


/* LOGOUT */

logoutButton.addEventListener(
  "click",
  () => {

    if(socket){

      try{
        socket.close();
      }catch(e){}
    }


    localStorage.removeItem(
      "samirchat_username"
    );

    localStorage.removeItem(
      "samirchat_token"
    );


    username = "";
    token = "";
    selectedUser = null;


    chatApp.style.display =
      "none";

    loginScreen.style.display =
      "grid";

    usernameInput.value = "";
    codeInput.value = "";

    loginError.textContent = "";
  }
);


/* WEBSOCKET */

function connect(){

  if(!token){
    return;
  }


  if(socket){

    try{
      socket.close();
    }catch(e){}
  }


  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  const wsUrl =
    protocol +
    "//" +
    location.host +
    "/ws?token=" +
    encodeURIComponent(token);


  socket =
    new WebSocket(wsUrl);


  socket.addEventListener(
    "open",
    () => {

      connectionDot.classList.add(
        "online"
      );

      chatSubtitle.textContent =
        "online";

      updateUsers([]);
    }
  );


  socket.addEventListener(
    "message",
    event => {

      try{

        const data =
          JSON.parse(
            event.data
          );


        if(data.type === "welcome"){

          updateUsers(
            data.users || []
          );
        }


        if(data.type === "users"){

          updateUsers(
            data.users || []
          );
        }


        if(data.type === "message"){

          if(!selectedUser){

            addMessage(
              data.username,
              data.text,
              data.time
            );
          }
        }


        if(data.type === "dm"){

          if(
            selectedUser &&
            (
              data.from.toLowerCase() ===
                selectedUser.toLowerCase()
              ||
              data.to.toLowerCase() ===
                selectedUser.toLowerCase()
            )
          ){

            addDMMessage(data);
          }
        }


        if(data.type === "system"){

          if(!selectedUser){

            addSystem(data.text);
          }
        }


        if(data.type === "error"){

          addSystem(
            "⚠️ " + data.error
          );
        }

      }catch(error){

        console.error(
          "WS ERROR:",
          error
        );
      }
    }
  );


  socket.addEventListener(
    "close",
    () => {

      connectionDot.classList.remove(
        "online"
      );

      chatSubtitle.textContent =
        "offline";
    }
  );


  socket.addEventListener(
    "error",
    error => {

      console.error(
        "WebSocket ERROR:",
        error
      );
    }
  );
}


/* USERS */

function updateUsers(users){

  usersList.innerHTML = "";


  const filtered =
    users.filter(
      user =>
        user.toLowerCase() !==
        username.toLowerCase()
    );


  if(filtered.length === 0){

    usersList.innerHTML =
      `<div style="color:#817e99;font-size:13px;padding:10px">
        Hazırda başqa online istifadəçi yoxdur.
      </div>`;

    return;
  }


  filtered.forEach(user => {

    const div =
      document.createElement("div");

    div.className =
      "user" +
      (
        selectedUser === user
          ? " active"
          : ""
      );


    div.innerHTML = `
      <div class="avatar">
        ${escapeHtml(
          user.charAt(0).toUpperCase()
        )}
      </div>

      <div>
        <b>
          @${escapeHtml(user)}
          <span class="onlineDot"></span>
        </b>

        <small>
          Online · DM üçün toxun
        </small>
      </div>
    `;


    div.addEventListener(
      "click",
      () => openDM(user)
    );


    usersList.appendChild(div);
  });
}


/* SEARCH */

searchInput.addEventListener(
  "input",
  () => {

    const query =
      searchInput.value
        .trim()
        .toLowerCase();


    document
      .querySelectorAll(".user")
      .forEach(element => {

        element.style.display =
          element.innerText
            .toLowerCase()
            .includes(query)
              ? "flex"
              : "none";
      });
  }
);


/* GENERAL */

function showGeneralChat(){

  selectedUser = null;


  chatTitle.textContent =
    "Ümumi söhbət";


  chatSubtitle.textContent =
    "SamirChat";


  chatAvatar.textContent =
    "S";


  messages.innerHTML = `
    <div class="notice">
      💜 Söhbətdə bir-birinizə qarşı olan hörməti pozmayın.
    </div>

    <div class="empty">
      <div class="emptyIcon">💬</div>
      <h2>Ümumi söhbət</h2>
      <p>Hamı ilə burada söhbət edə bilərsən.</p>
    </div>
  `;
}


/* DM */

async function openDM(user){

  if(
    user.toLowerCase() ===
    username.toLowerCase()
  ){
    return;
  }


  selectedUser =
    user;


  chatTitle.textContent =
    "@" + user;


  chatSubtitle.textContent =
    "Şəxsi mesaj";


  chatAvatar.textContent =
    user.charAt(0).toUpperCase();


  messages.innerHTML = "";


  const notice =
    document.createElement("div");

  notice.className =
    "notice";

  notice.textContent =
    "💜 Şəxsi söhbətdə bir-birinizə qarşı hörmətli olun.";


  messages.appendChild(
    notice
  );


  try{

    const response =
      await fetch(
        "/api/dm?with=" +
        encodeURIComponent(user),
        {
          headers:{
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const data =
      await response.json();


    if(
      data.ok &&
      Array.isArray(data.messages)
    ){

      data.messages.forEach(
        addDMMessage
      );
    }

  }catch(error){

    console.error(
      "DM HISTORY ERROR:",
      error
    );

    addS
